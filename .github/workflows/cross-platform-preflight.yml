  windows_g09_clr_fixture:
    name: Windows fixed Framework CLR reader fixture
    needs: validate_scope
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows && inputs.windows_atomic_debug_scope == 'g09_clr_fixture' }}
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: 'C:\infinishell-ci\cargo-target'
      RUSTC_WRAPPER: 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
      SCCACHE_DIR: 'C:\infinishell-ci\sccache'
      SCCACHE_CACHE_SIZE: 80G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 先独立证明固定 CLR 的字段/栈读取和精确回收，不执行真实 PowerShell 候选。
      - name: Check fixed CLR controller types
        shell: pwsh
        run: cargo check --locked -p command --tests

      - name: Test fixed CLR receipt binding
        shell: pwsh
        run: cargo nextest run --locked --no-fail-fast --retries 0 -p command --lib -E 'test(windows::clr_fixture_tests::) | test(windows::clr_reader::tests::) | test(windows::shell_classification::tests::)'

      - name: Build fixed CLR reader with existing MSVC
        shell: powershell
        run: ./script/ci/g09-clr-fixture/build-reader.ps1

      - name: Prepare fixed Framework exception fixture
        shell: powershell
        run: ./script/ci/g09-clr-fixture/prepare.ps1 -Reader $env:INFINISHELL_CLR_READER

      - name: Verify original CLR exception thread and bounded reader cleanup
        shell: pwsh
        timeout-minutes: 3
        run: cargo nextest run --locked --no-fail-fast --retries 0 --run-ignored only -p command --lib -E 'test(windows::clr_fixture_tests::framework_exception_chain_uses_original_event_thread_and_reaps_reader)'

      - name: Preserve fixed CLR reader and fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
