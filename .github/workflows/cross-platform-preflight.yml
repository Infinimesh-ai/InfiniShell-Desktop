name: Cross-platform preflight

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:
    inputs:
      run_linux:
        description: Run the Linux self-hosted job
        required: true
        default: true
        type: boolean
      run_windows:
        description: Run the Windows self-hosted job
        required: true
        default: true
        type: boolean
      run_macos_intel:
        description: 备用：交叉构建并原生验证 macOS x86_64 SSH 扩展
        required: true
        default: false
        type: boolean
      full_workspace_tests:
        description: Compile GUI integration tests and run the desktop workspace unit suite
        required: true
        default: false
        type: boolean
      native_acceptance_only:
        description: 仅补验原生 CLI 安装升级和 GUI；全量模式优先
        required: true
        default: false
        type: boolean
      run_gui_clipboard:
        description: 单独复验真实 GUI 系统剪贴板，不重复完整工作区测试
        required: true
        default: false
        type: boolean
      linux_gui_only:
        description: 仅补验 Linux 真实 GUI 系统剪贴板；全量模式优先
        required: true
        default: false
        type: boolean
      windows_grok_installer_only:
        description: 默认仅补验 Windows Grok 安装器；开启原子更新时附加所选 CLI 更新；全量模式优先
        required: true
        default: false
        type: boolean
      run_cli_atomic_updates:
        description: 固定 0.156.1 / 2.1.280 / 1.0.41 的隔离真实原子更新候选
        required: true
        default: false
        type: boolean
      run_claude_npm_updates:
        description: Linux 私有 npm 安装的 Claude 2.1.280 更新及中断恢复
        required: true
        default: false
        type: boolean
      run_atomic_windows_debug:
        description: Diagnose bounded native Windows image-debug exit and rejection
        required: true
        default: false
        type: boolean
      windows_atomic_agent:
        description: Windows Grok 安装器专项附加升级对象；默认、原生和全量模式仍验三款
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - claude
          - grok
      linux_atomic_agent:
        description: 原生补验模式的 Linux 升级对象；默认和全量模式始终验三款
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - claude
          - grok
# 自托管 runner 只需要读取代码。这个 workflow 不接收部署密钥，也不向仓库写入内容。
permissions:
  contents: read

concurrency:
  group: cross-platform-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux x64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_linux)
    runs-on: [self-hosted, linux, x64, infinishell-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 固定完整 action 提交和 Python 补丁版本，只更新当前作业的工具链环境。
      - name: Install Python for CLI parity verification
        id: native_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 10
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
          update-environment: true

      - name: Verify provisioned toolchain
        id: linux_toolchain
        shell: bash
        run: |
          set -euo pipefail
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version

      # 复用 prepare_environment 中固定的 Node 引导，实际运行测试而非依赖 runner 的旧版本。
      - name: Install Node for CLI plugin verification
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) }}
        id: native_node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0

      - name: Test Grok notification plugin scripts
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' && steps.native_node.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 18) throw new Error('Node 18+ is required');"
          node --test script/cli-agent-parity/grok_plugin_tests.cjs
          python3 -B script/cli-agent-parity/grok_plugin_live_runner_tests.py -v
          python3 -B script/cli-agent-parity/native_ssh_notifications_tests.py NativeSshNotificationTests.test_grok_bridge_main_uses_the_same_guarded_mapper_on_each_desktop -v

      - name: Test notification patch file transactions
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          command -v python3
          python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11+ is required'; print(sys.version)"
          python3 script/cli-agent-parity/notification_patch_tests.py -v
          python3 -B script/cli-agent-parity/codex_persistent_source_tests.py -v
          python3 script/cli-agent-parity/codex_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_profile_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_coordinator_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_coordinator_v2_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_batch_cancel_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_approval_cancel_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_image_probe_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_managed_image_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_rich_image_runner_portability_tests.py -v
          python3 -B script/cli-agent-parity/codex_source_runner_tests.py -v
          python3 -B script/cli-agent-parity/codex_journal_recovery_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_coordinator_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_official_pty_runner_tests.py -v
          # 官方隔离运行器的 POSIX 权限与私有文件回归，不发起模型请求。
          python3 -B script/cli-agent-parity/grok_official_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_sdk_origin_probe_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_native_tool_lease_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_policy_preflight_runner_tests.py -v
          # 仅运行合成证据与准备边界回归，不启动真实 CLI 或模型。
          python3 -B script/cli-agent-parity/grok_native_skill_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_fixed_policy_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_child_coordinator_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_files_policy_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_selected_skill_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_catalog_preflight_runner_tests.py -v
          python3 -B script/cli-agent-parity/codex_windows_hook_tests.py -v
          python3 -B script/cli-agent-parity/codex_plugin_lifecycle_tests.py -v
          python3 -B script/cli-agent-parity/codex_windows_notify_tests.py -v
          python3 -B script/cli-agent-parity/codex_plugin_cache_refresh_tests.py -v
          python3 -B script/cli-agent-parity/prepare_codex_cli_tests.py -v
          python3 -B script/cli-agent-parity/verify_cli_autoupdate_tests.py -v
          python3 -B script/cli-agent-parity/run_fixed_cli_autoupdate_tests.py -v
          python3 -B script/cli-agent-parity/claude_npm_update_live_runner_tests.py -v
          # 原始 Grok P0 的 POSIX 离线夹具；不启动真实 CLI 或模型。
          python3 -B script/cli-agent-parity/grok_native_p0_probe_tests.py -v
          python3 -B script/cli-agent-parity/prepare_claude_cli_tests.py -v
          python3 -B script/cli-agent-parity/claude_windows_notifications_tests.py -v
          python3 -B script/cli-agent-parity/prepare_grok_cli_tests.py -v
          python3 -B script/cli-agent-parity/grok_fixed_acp_probe_tests.py -v
          python3 -B script/cli-agent-parity/run_grok_supervised_exit_tests.py -v
          python3 -B script/cli-agent-parity/probe_claude_no_credentials_tests.py -v
          python3 -B script/cli-agent-parity/probe_claude_permission_snapshot_tests.py -v

      - name: Prepare fixed native Codex without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' && steps.linux_toolchain.outcome == 'success' }}
        id: fixed_codex
        shell: bash
        run: |
          set -euo pipefail
          codex_executable="$(python3 -B script/cli-agent-parity/prepare_codex_cli.py --version 0.156.1 --download-dir "$RUNNER_TEMP/codex-01561-inputs")"
          printf 'INFINISHELL_TEST_CODEX_EXE=%s\n' "$codex_executable" >> "$GITHUB_ENV"

      - name: Prepare fixed native Claude without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' && steps.linux_toolchain.outcome == 'success' }}
        id: fixed_claude
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          claude_executable="$(python3 -B script/cli-agent-parity/prepare_claude_cli.py --claude-version 2.1.280 --download-dir "$RUNNER_TEMP/claude-21280-inputs")"
          printf 'INFINISHELL_TEST_CLAUDE_EXE=%s\n' "$claude_executable" >> "$GITHUB_ENV"

      - name: Prepare fixed native Grok without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' && steps.linux_toolchain.outcome == 'success' }}
        id: fixed_grok
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          grok_executable="$(python3 -B script/cli-agent-parity/prepare_grok_cli.py --version 1.0.41 --download-dir "$RUNNER_TEMP/grok-cli-fixed")"
          printf 'INFINISHELL_TEST_GROK_EXE=%s\n' "$grok_executable" >> "$GITHUB_ENV"

      - name: Verify fixed Grok unauthenticated ACP boundaries
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.fixed_grok.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/grok_fixed_acp_probe.py --version 1.0.41 --executable "$INFINISHELL_TEST_GROK_EXE" --output "$RUNNER_TEMP/grok-fixed-acp.json"

      - name: Verify native Claude initialization and idle EOF
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.fixed_claude.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_claude_no_credentials.py --claude-version 2.1.280 --executable "$INFINISHELL_TEST_CLAUDE_EXE" --output "$RUNNER_TEMP/claude-initialize-idle-eof.json"

      - name: Verify native Claude permission observations without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.fixed_claude.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_claude_permission_snapshot.py --claude-version 2.1.280 --executable "$INFINISHELL_TEST_CLAUDE_EXE" --output "$RUNNER_TEMP/claude-permission-observation.json"

      - name: Verify native Codex plugin registry failure recovery
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.fixed_codex.outcome == 'success' }}
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_codex_plugin_lifecycle.py --codex-version 0.156.1 --codex-executable "$INFINISHELL_TEST_CODEX_EXE" --output "$RUNNER_TEMP/codex-plugin-lifecycle.json"

      - name: Verify native Codex persistent plugin source
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.fixed_codex.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_codex_plugin_cache_refresh.py --codex-version 0.156.1 --codex-executable "$INFINISHELL_TEST_CODEX_EXE" --output "$RUNNER_TEMP/codex-plugin-cache-refresh.json"

      - name: Test Claude and Codex Bash notification payloads
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          command -v bash
          command -v jq
          bash --version
          jq --version
          python3 script/cli-agent-parity/plugin_compatibility_tests.py -v

      - name: Test Unix PTY notification framing
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.native_python.outcome == 'success' }}
        shell: bash
        run: python3 script/cli-agent-parity/tmux_notification_tests.py

      - name: Check InfiniShell-Desktop
        if: ${{ !cancelled() && steps.linux_toolchain.outcome == 'success' }}
        id: check_app
        shell: bash
        run: cargo check -p warp --lib

      # GUI 专项包含字体行为修正，仍保留用户功能的双语资源门禁。
      - name: Test bilingual resources for Linux GUI verification
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.linux_gui_only && !inputs.full_workspace_tests }}
        shell: bash
        run: cargo test -p warp --lib i18n::tests

      # Windows named-pipe stream 与创建它的 Tokio reactor 绑定；Linux 同步执行同一合同。
      - name: Test IPC frame-limit recovery
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' }}
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p ipc --lib
          -E 'test(server_accepts_a_new_client_after_rejecting_an_oversized_frame) | test(client_disconnects_after_an_oversized_response_header)'

      - name: Test agent lifecycle, terminal cancellation, and Responses integration
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' }}
        id: test_app
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p warp --lib
          -E '${{ github.event_name == 'workflow_dispatch' && inputs.native_acceptance_only && !inputs.full_workspace_tests && 'test(ai::cli_agent_runtime::grok::) | test(terminal::cli_agent_sessions::plugin_manager::) | test(terminal::cli_agent_updates::) | test(ai::cli_agent_runtime::managed_process::) | test(terminal::local_tty::)' || 'test(responses) | test(ai::agent_providers::) | test(ai::api_error::tests) | test(ai::byop_compaction::) | test(ai::blocklist::controller) | test(ai::agent::tests::format_for_copy) | test(terminal::view::tests::stop_task_) | test(terminal::view::tests::failed_conversation_interrupts_command_without_overwriting_error) | test(ai::blocklist::action_model::tests::) | test(ai::blocklist::action_model::preprocess::tests::) | test(ai::blocklist::action_model::execute::) | test(terminal::view::tests::stopped_command_) | test(completed_user_controlled_lrc_) | test(inline_agent_view_persists_across_transfer_takeover_for_monitored_long_running_command) | test(terminal::local_tty::event_loop::tests::) | test(terminal::local_tty::windows::event_loop_tests::) | test(synchronized_output) | test(ai::agent::conversation::) | test(ai::agent::task::) | test(ai::skills::) | test(ai::blocklist::history_model) | test(persistence::sqlite::checkpoint_tests) | test(i18n::tests) | test(cli_agent) | test(specific_cli_launch) | test(cli_draft) | test(terminal::model::session::test::) | test(terminal::model::ansi::dcs_hooks::tests::) | test(ai::agent_sdk::driver::harness::) | test(terminal::view::use_agent_footer::) | test(editor::view::image_input::tests) | test(local_cli_review_import) | test(local_harness) | test(harness_availability) | test(local_cli_tasks) | test(local_cli_mailbox) | test(terminal::input::skills::) | test(terminal::input::slash_commands::data_source::) | test(ai::orchestration::)' }}'

      # 共享 CLI 状态转换和 TUI 消息渲染属于独立 crate，不能被 -p warp 的筛选覆盖。
      - name: Test shared CLI action contracts and skills
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests) }}
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p ai --lib
          -E 'test(agent::action_result::) | test(agent::action::) | test(skills::)'

      - name: Test CLI harness arguments
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests) }}
        shell: bash
        run: cargo nextest run --no-fail-fast -p warp_cli --lib

      - name: Test bilingual TUI task message states
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests) }}
        shell: bash
        run: cargo nextest run --no-fail-fast -p warp_tui --lib -E 'test(tool_call_labels::tests::)'

      - name: Test managed command process ownership
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' }}
        shell: bash
        run: cargo nextest run --no-fail-fast -p command --lib -E 'test(managed::tests::)'

      # 使用同一提交构建的真实 worker；内部夹具和模型网络验收不混入此筛选。
      - name: Build CLI process supervisor
        id: supervisor
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build -p warp_tui --bin infinishell-tui

      - name: Test installed Grok hook through the native notification worker
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.supervisor.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          # Cargo 可以把顶层二进制硬链接到 deps 产物；正式安装身份门禁要求单链接文件。
          # 复制同提交构建产物到 runner 私有目录，不放宽生产 worker 的身份校验。
          install -m 0755 "$target_dir/debug/infinishell-tui" "$RUNNER_TEMP/infinishell-test-notify-worker"
          export INFINISHELL_TEST_NOTIFY_WORKER="$RUNNER_TEMP/infinishell-test-notify-worker"
          python3 -B script/cli-agent-parity/installed_grok_hook_tests.py -v

      # 只验原生安装/inspect/升级/禁用/修复；没有凭据时不声称 SessionStart 已派发。
      - name: Verify fixed Linux Grok production notification installer without credentials
        id: grok_source_installer
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && steps.fixed_grok.outcome == 'success' }}
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          test_binary="$(cargo test -p warp --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; paths=[item["executable"] for item in items if item.get("reason")=="compiler-artifact" and item.get("target",{}).get("name")=="warp" and item.get("profile",{}).get("test") and item.get("executable")]; assert len(paths)==1, paths; print(paths[0])')"
          python3 -B script/cli-agent-parity/run_grok_plugin_live.py --test-binary "$test_binary" --grok "$INFINISHELL_TEST_GROK_EXE" --node "$(command -v node)" --fixture-parent "$RUNNER_TEMP" --output "$RUNNER_TEMP/grok-production-installer.safe.json"

      - name: Preserve Linux Grok production installer evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.grok_source_installer.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grok-linux-production-installer-${{ github.sha }}
          path: ${{ runner.temp }}/grok-production-installer.safe.json
          if-no-files-found: error
          retention-days: 14

      # 固定发行输入仅在 ignored 验收作用域替代发现；消费者仍查询官方真实渠道。
      - name: Verify fixed Linux CLI atomic update transactions without credentials
        id: fixed_cli_atomic_updates
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && inputs.run_cli_atomic_updates && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: bash
        timeout-minutes: 90
        env:
          ATOMIC_AGENTS: ${{ inputs.native_acceptance_only && !inputs.full_workspace_tests && inputs.linux_atomic_agent != 'all' && inputs.linux_atomic_agent || 'codex claude grok' }}
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          test_binary="$(cargo test -p warp --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; paths=[item["executable"] for item in items if item.get("reason")=="compiler-artifact" and item.get("target",{}).get("name")=="warp" and item.get("profile",{}).get("test") and item.get("executable")]; assert len(paths)==1, paths; print(paths[0])')"
          # Linux 原子目录不接受共享 /tmp 祖先；新建的任务根仍位于当前 runner 私有 HOME 内。
          fixture_parent="$(mktemp -d "$HOME/infinishell-fixed-cli-updates.XXXXXXXX")"
          read -r -a atomic_agents <<< "$ATOMIC_AGENTS"
          python3 -B script/cli-agent-parity/run_fixed_cli_autoupdate.py --test-binary "$test_binary" --supervisor "$target_dir/debug/infinishell-tui" --fixture-parent "$fixture_parent" --cache "$RUNNER_TEMP/fixed-cli-atomic-inputs" --output "$RUNNER_TEMP/fixed-cli-atomic-evidence/summary.safe.json" --agents "${atomic_agents[@]}"

      - name: Preserve Linux fixed CLI atomic update receipts
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.fixed_cli_atomic_updates.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux-fixed-atomic-updates-${{ github.sha }}
          path: ${{ runner.temp }}/fixed-cli-atomic-evidence/*.safe.json
          if-no-files-found: error
          retention-days: 14

      # 私有 HOME 下构造官方 npm 安装副本；不运行安装脚本，也不使用认证或模型。
      - name: Verify fixed Linux Claude npm update transactions without credentials
        id: claude_npm_updates
        if: ${{ !cancelled() && inputs.run_claude_npm_updates && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          test_binary="$(cargo test -p warp --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; paths=[item["executable"] for item in items if item.get("reason")=="compiler-artifact" and item.get("target",{}).get("name")=="warp" and item.get("profile",{}).get("test") and item.get("executable")]; assert len(paths)==1, paths; print(paths[0])')"
          fixture_parent="$(mktemp -d "$HOME/infinishell-claude-npm.XXXXXXXX")"
          printf 'CLAUDE_NPM_EVIDENCE=%s/evidence\n' "$fixture_parent" >> "$GITHUB_ENV"
          # 独立复制同提交二进制，避免 Cargo 的硬链接被识别为可共享的执行入口。
          install -m 0755 "$target_dir/debug/infinishell-tui" "$fixture_parent/supervisor"
          install -m 0755 "$test_binary" "$fixture_parent/warp-libtest"
          node_path="$(python3 -c 'import pathlib,shutil; print(pathlib.Path(shutil.which("node")).resolve(strict=True))')"
          npm_path="$(python3 -c 'import pathlib,shutil; print(pathlib.Path(shutil.which("npm")).resolve(strict=True))')"
          digest() { sha256sum "$1" | cut -d ' ' -f 1; }
          test "$(digest "$target_dir/debug/infinishell-tui")" = "$(digest "$fixture_parent/supervisor")"
          test "$(digest "$test_binary")" = "$(digest "$fixture_parent/warp-libtest")"
          python3 -B script/cli-agent-parity/run_claude_npm_update_live.py \
            --repo "$GITHUB_WORKSPACE" --output "$fixture_parent/evidence" \
            --test-binary "$fixture_parent/warp-libtest" --test-binary-sha256 "$(digest "$fixture_parent/warp-libtest")" \
            --supervisor "$fixture_parent/supervisor" --supervisor-sha256 "$(digest "$fixture_parent/supervisor")" \
            --node "$node_path" --node-sha256 "$(digest "$node_path")" \
            --npm-cli "$npm_path" --npm-cli-sha256 "$(digest "$npm_path")"

      - name: Preserve Linux Claude npm update receipts
        if: ${{ !cancelled() && inputs.run_claude_npm_updates && steps.claude_npm_updates.outcome != 'skipped' && env.CLAUDE_NPM_EVIDENCE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux-claude-npm-updates-${{ github.sha }}
          path: |
            ${{ env.CLAUDE_NPM_EVIDENCE }}/**/*.safe.json
            ${{ env.CLAUDE_NPM_EVIDENCE }}/**/*.metadata.json
            ${{ env.CLAUDE_NPM_EVIDENCE }}/**/*.stdout
            ${{ env.CLAUDE_NPM_EVIDENCE }}/**/*.stderr
            ${{ env.CLAUDE_NPM_EVIDENCE }}/**/cli-agent-processes/**/*.json
            ${{ env.CLAUDE_NPM_EVIDENCE }}/**/cli-agent-processes/**/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Test supervisor cleanup after host crash
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          export INFINISHELL_CLI_SUPERVISOR_EXECUTABLE="$target_dir/debug/infinishell-tui"
          cargo nextest run --no-fail-fast -p warp --lib --run-ignored only -E 'test(managed_process::live_tests::supervised_)'

      - name: Verify native recovery and idle-crash boundaries without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && steps.fixed_codex.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          test_binary="$(cargo test -p warp --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; paths=[item["executable"] for item in items if item.get("reason")=="compiler-artifact" and item.get("target",{}).get("name")=="warp" and item.get("profile",{}).get("test") and item.get("executable")]; assert len(paths)==1, paths; print(paths[0])')"
          python3 -B script/cli-agent-parity/run_codex_adapter_live.py --test-case missing-session --test-binary "$test_binary" --codex "$INFINISHELL_TEST_CODEX_EXE" --supervisor "$target_dir/debug/infinishell-tui" --output "$RUNNER_TEMP/codex-missing-session.ndjson"
          python3 -B script/cli-agent-parity/run_codex_adapter_live.py --test-case idle-crash --test-binary "$test_binary" --codex "$INFINISHELL_TEST_CODEX_EXE" --supervisor "$target_dir/debug/infinishell-tui" --output "$RUNNER_TEMP/codex-idle-crash.ndjson"

      - name: Verify fixed Grok production supervised cleanup without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && steps.fixed_grok.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          test_binary="$(cargo test -p warp --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; paths=[item["executable"] for item in items if item.get("reason")=="compiler-artifact" and item.get("target",{}).get("name")=="warp" and item.get("profile",{}).get("test") and item.get("executable")]; assert len(paths)==1, paths; print(paths[0])')"
          python3 -B script/cli-agent-parity/run_grok_supervised_exit.py --test-binary "$test_binary" --grok "$INFINISHELL_TEST_GROK_EXE" --supervisor "$target_dir/debug/infinishell-tui" --output "$RUNNER_TEMP/grok-supervised-exit.json"

      - name: Preserve Linux native CLI boundary evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux-native-boundaries-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-plugin-lifecycle.json
            ${{ runner.temp }}/codex-plugin-cache-refresh.json
            ${{ runner.temp }}/codex-missing-session.*
            ${{ runner.temp }}/codex-idle-crash.*
            ${{ runner.temp }}/claude-initialize-idle-eof.json
            ${{ runner.temp }}/claude-permission-observation.json
            ${{ runner.temp }}/claude-21280-inputs/claude-fixed-inputs.json
            ${{ runner.temp }}/grok-cli-fixed/grok-fixed-inputs.json
            ${{ runner.temp }}/grok-fixed-acp.json
            ${{ runner.temp }}/grok-supervised-exit.json
          if-no-files-found: error
          retention-days: 14

      - name: Test rust-genai
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.linux_gui_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' }}
        shell: bash
        run: cargo test --manifest-path lib/rust-genai/Cargo.toml --lib

      - name: Compile GUI integration tests
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.full_workspace_tests || inputs.run_gui_clipboard || inputs.linux_gui_only) }}
        shell: bash
        run: cargo nextest run --no-run -p integration

      - name: Verify Linux GUI system clipboard without model inputs
        id: cli_gui_input
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.full_workspace_tests || inputs.run_gui_clipboard || inputs.linux_gui_only) }}
        shell: bash
        timeout-minutes: 15
        env:
          WARP_INTEGRATION: "1"
          WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: "1"
          WARP_TEST_GUI_SOURCE_COMMIT: ${{ github.sha }}
          WARP_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/gui-input-evidence/linux
        run: |
          set -euo pipefail
          install_gui_dependencies() {
            local attempt
            local -a apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            # 优先使用已有认证索引；安装仍由 APT 校验包摘要，避免无关镜像同步阻断。
            if sudo -n apt-get "${apt_options[@]}" install -y "$@"; then
              return 0
            fi
            # 刷新按摘要获取索引，任何索引失败均返回错误；重试耗尽不能继续 GUI。
            for attempt in 1 2 3; do
              if timeout 120s sudo -n apt-get "${apt_options[@]}" -o Acquire::By-Hash=force -o APT::Update::Error-Mode=any update -q; then
                if sudo -n apt-get "${apt_options[@]}" install -y "$@"; then
                  return 0
                else
                  return "$?"
                fi
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep 5
              fi
            done
            return 1
          }
          # winit 通过 dlopen 加载 X11 运行库；已安装 Xvfb 不代表窗口依赖齐全。
          if ! command -v xvfb-run >/dev/null || ! command -v xclip >/dev/null ||
            ! python3 -c 'import ctypes; [ctypes.CDLL(name) for name in ("libX11.so.6", "libXcursor.so.1", "libX11-xcb.so.1", "libXi.so.6", "libxkbcommon.so.0", "libxkbcommon-x11.so.0")]'; then
            install_gui_dependencies xvfb xauth xclip libgl1-mesa-dri mesa-vulkan-drivers libx11-6 libxcursor1 libx11-xcb1 libxi6 libxkbcommon0 libxkbcommon-x11-0
          fi
          # 字体前置独立于 X11 依赖，已有窗口运行库不能证明中文可渲染。
          if ! command -v fc-list >/dev/null ||
            [[ "$(dpkg-query -W -f='${db:Status-Status}' fonts-noto-cjk 2>/dev/null || true)" != installed ]]; then
            install_gui_dependencies fontconfig fonts-noto-cjk
          fi
          fc-cache -f
          mkdir -p "$WARP_INTEGRATION_TEST_ARTIFACTS_DIR"
          font_evidence="$WARP_INTEGRATION_TEST_ARTIFACTS_DIR/system-cjk-font-coverage.txt"
          : > "$font_evidence"
          # 对“中文第一行 / 第二行”的每个不同汉字检查真实字符覆盖；fc-match 允许替代字体，不能作为此门禁。
          for codepoint in 4e2d 6587 7b2c 4e00 884c 4e8c; do
            font_families="$(fc-list --format='%{family}\n' ":charset=$codepoint")"
            if [[ -z "$font_families" ]]; then
              printf '缺少中文样本字形 U+%s 的系统字体\n' "$codepoint" >&2
              exit 1
            fi
            printf 'U+%s\n%s\n' "$codepoint" "$font_families" >> "$font_evidence"
          done
          cargo build -p integration --bin integration
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          # 同一真实用例按语言独立启动；窗口构造时即使用目标语言，产物分别保留。
          for locale in en zh-CN; do
            WARP_TEST_GUI_LOCALE="$locale" \
              WARP_INTEGRATION_TEST_ARTIFACTS_DIR="$WARP_INTEGRATION_TEST_ARTIFACTS_DIR/$locale" \
              timeout 180s xvfb-run -a -s '-screen 0 1600x1000x24' "$target_dir/debug/integration" test_cli_composer_system_clipboard_multiline_and_image
          done

      - name: Preserve Linux GUI system clipboard evidence
        if: ${{ !cancelled() && (steps.cli_gui_input.outcome == 'success' || steps.cli_gui_input.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux-gui-system-clipboard-${{ github.sha }}
          path: ${{ runner.temp }}/gui-input-evidence/linux
          if-no-files-found: error
          retention-days: 14

      - name: Run desktop workspace unit tests
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: bash
        # 全量桌面测试不包含 TUI；本次变动的 TUI 消息状态已由上方定向步骤覆盖。
        # integration 的系统剪贴板用例由上方专用真实窗口步骤执行，其余 GUI 不计为全量通过。
        run: cargo nextest run --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude warp_tui

  macos_intel_ssh_extension_build:
    name: macOS Intel SSH extension fallback cross-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_intel }}
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      release_tag: ${{ steps.metadata.outputs.tag }}
    env:
      CHANNEL: oss
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: preflight-macos-x86_64-ssh-extension
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure Intel rust target is installed
        shell: bash
        run: rustup target add x86_64-apple-darwin

      - name: Compute temporary extension version
        id: metadata
        shell: bash
        run: |
          tag="v0.$(date -u +%Y.%m.%d.%H.%M).oss_01"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cross-build Intel SSH extension
        id: bundle_cli
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          df -h .
          sysctl -n hw.memsize
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --nosign

      - name: Verify Intel SSH extension tarball
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ steps.bundle_cli.outputs.binary_path }}"
          resources="${{ steps.bundle_cli.outputs.bundled_resources_dir }}"
          file "$binary"
          [[ "$(lipo -archs "$binary")" == "x86_64" ]]
          cp "$binary" infinishell
          tar czf infinishell-macos-x86_64.tar.gz infinishell \
            -C "$(dirname "$resources")" resources
          shasum -a 256 infinishell-macos-x86_64.tar.gz
          df -h .

      - name: Upload Intel SSH extension preflight tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infinishell-macos-x86_64-ssh-extension-preflight
          path: infinishell-macos-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 3

  macos_intel_ssh_extension_native:
    name: macOS Intel SSH extension native acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_intel }}
    needs: macos_intel_ssh_extension_build
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Download Intel SSH extension preflight tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infinishell-macos-x86_64-ssh-extension-preflight
          path: artifact

      - name: Run Intel SSH extension natively
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.macos_intel_ssh_extension_build.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infinishell-intel-ssh-extension"
          tar xzf artifact/infinishell-macos-x86_64.tar.gz \
            -C "$RUNNER_TEMP/infinishell-intel-ssh-extension"
          cd "$RUNNER_TEMP/infinishell-intel-ssh-extension"
          [[ "$(lipo -archs infinishell)" == "x86_64" ]]
          version=$(./infinishell --version)
          echo "$version"
          [[ "$version" == *"$EXPECTED_TAG"* ]]
          test -d resources

  windows:
    name: Windows x64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_windows)
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: 'C:\infinishell-ci\cargo-target'
      RUSTC_WRAPPER: 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
      SCCACHE_DIR: 'C:\infinishell-ci\sccache'
      SCCACHE_CACHE_SIZE: 80G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 空间充足时复用 Cargo/sccache；不足时才清理可重建产物，避免每轮从零编译。
      - name: Reclaim Windows build storage
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = Get-PSDrive -Name C
          $drive | Select-Object Name, Used, Free
          if ($drive.Free -ge 100GB) {
            Write-Output 'At least 100 GiB free; retaining Cargo and sccache build artifacts'
            exit 0
          }
          & $env:RUSTC_WRAPPER --stop-server
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'No running sccache server needed to be stopped'
          }

          $buildRoots = @(
            'C:\infinishell-ci\cargo-target',
            'C:\infinishell-ci\sccache'
          )
          foreach ($buildRoot in $buildRoots) {
            $resolved = [System.IO.Path]::GetFullPath($buildRoot)
            if ($resolved -ne $buildRoot) {
              throw "Unexpected build cleanup path: $resolved"
            }
            if (Test-Path -LiteralPath $resolved) {
              Remove-Item -LiteralPath $resolved -Recurse -Force
            }
            New-Item -ItemType Directory -Path $resolved | Out-Null
          }
          Get-PSDrive -Name C | Select-Object Name, Used, Free
          exit 0

      # 直接解压固定摘要的官方 CI 包，保持当前作业以外的 Python 安装配置。
      - name: Prepare job-local Python for CLI parity verification
        id: native_python
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/prepare_windows_python.ps1

      - name: Configure Windows build environment
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $strawberryPerl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $strawberryPerl) {
            'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "OPENSSL_SRC_PERL=$strawberryPerl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $libclang = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $libclang 'libclang.dll')) {
            $libclang | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Verify provisioned toolchain
        id: windows_toolchain
        shell: pwsh
        run: |
          $commands = @('git', 'bash', 'rustc', 'cargo', 'cmake', 'protoc', 'perl')
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required command is missing: $command"
            }
          }
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version
          & $env:RUSTC_WRAPPER --version
          & $env:RUSTC_WRAPPER --zero-stats

      # 与仓库共用构建引导使用同一固定 Node 版本；缺依赖必须失败，不能跳过校验。
      - name: Install Node for CLI plugin verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0

      - name: Test Grok notification plugin scripts
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node version probe failed' }
          node -e "if (Number(process.versions.node.split('.')[0]) < 18) throw new Error('Node 18+ is required');"
          if ($LASTEXITCODE -ne 0) { throw 'Node test runtime is unavailable' }
          node --test script/cli-agent-parity/grok_plugin_tests.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Grok notification script tests failed' }
          python -B script/cli-agent-parity/grok_plugin_live_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok production installer runner tests failed' }
          python -B script/cli-agent-parity/native_ssh_notifications_tests.py NativeSshNotificationTests.test_grok_bridge_main_uses_the_same_guarded_mapper_on_each_desktop -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok notification bridge contract tests failed' }

      # 安装器补验跳过无关 CLI 的离线合集，仅保留固定 Grok 获取前置。
      - name: Test fixed Grok preparation for installer-only verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_grok_installer_only && !inputs.full_workspace_tests }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/prepare_grok_cli_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok preparation runner tests failed' }

      - name: Test notification patch file transactions
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw 'Native Python 3.11+ is required; notification file transactions were not verified'
