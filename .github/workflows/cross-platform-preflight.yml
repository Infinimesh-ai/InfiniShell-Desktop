      - name: Verify native Claude permission observations without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_claude.outcome == 'success') }}
