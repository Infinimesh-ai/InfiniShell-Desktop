      # 共享 CLI 状态转换和 TUI 消息渲染属于独立 crate，不能被 -p warp 的筛选覆盖。
      - name: Test shared CLI action contracts and skills
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests)) }}
        shell: pwsh
        run: >-
          cargo nextest run --no-fail-fast -p ai --lib
          -E 'test(agent::action_result::) | test(agent::action::) | test(skills::)'

      - name: Test CLI harness arguments
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests)) }}
        shell: pwsh
        run: cargo nextest run --no-fail-fast -p warp_cli --lib

      - name: Test bilingual TUI task message states
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests)) }}
        shell: pwsh
        run: cargo nextest run --no-fail-fast -p warp_tui --lib -E 'test(tool_call_labels::tests::)'

      - name: Test managed command process ownership
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests || inputs.run_cli_atomic_updates || inputs.run_windows_codex_npm_updates || inputs.run_atomic_windows_debug) && (!cancelled() && steps.check_app.outcome == 'success') }}
        shell: pwsh
        run: |
          $arguments = @('nextest', 'run', '--no-fail-fast', '-p', 'command', '--lib', '-E', 'test(managed::tests::) | test(managed_windows_image_observer::tests::) | test(managed_windows_console_probe::tests::) | test(windows::appcontainer::tests::) | test(windows::appcontainer::console_tests::) | test(windows::appcontainer::output::tests::) | test(windows::station_bootstrap::tests::) | test(windows::station_bootstrap::device_map::tests::) | test(windows::station_bootstrap::debugger::tests::) | test(windows::station_bootstrap::debugger::event::tests::)')
          if ('${{ inputs.run_windows_npm_native_witness }}' -eq 'true') { $arguments += @('--features', 'native-probe-witness') }
          cargo @arguments

      - name: Diagnose unnamed Windows station without changing the production probe
        if: ${{ !cancelled() && inputs.run_atomic_windows_debug && inputs.windows_atomic_debug_scope != 'g09_netcredentials' && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: cargo nextest run --no-fail-fast --retries 0 --success-output immediate -p command --lib --run-ignored only -E 'test(=windows::appcontainer::console_tests::unnamed_station_create_only_reports_identity_and_cleanup)'

      - name: Verify two-stage Windows logon window station identity and cleanup
        id: windows_netcredentials
        if: ${{ !cancelled() && inputs.run_atomic_windows_debug && inputs.windows_atomic_debug_scope == 'g09_netcredentials' && steps.check_app.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/verify_windows_netcredentials_station.ps1

      - name: Preserve two-stage Windows logon window station evidence
        if: ${{ !cancelled() && steps.windows_netcredentials.outcome != 'skipped' && env.INFINISHELL_WINDOWS_NETCREDENTIALS_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-netcredentials-station-${{ github.sha }}
          path: ${{ env.INFINISHELL_WINDOWS_NETCREDENTIALS_EVIDENCE_DIR }}/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Diagnose Windows atomic image-debug exit in a strict Job
        id: atomic_windows_debug
        # 原生调试可独立运行；保留首次失败，不继承服务会话测试的自动重试。
        if: ${{ !cancelled() && inputs.run_atomic_windows_debug && inputs.windows_atomic_debug_scope != 'g09_netcredentials' && steps.check_app.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        env:
          ATOMIC_WINDOWS_DEBUG_SCOPE: ${{ inputs.windows_atomic_debug_scope == 'upstream_essence' && 'all' || inputs.windows_atomic_debug_scope }}
        run: |
          switch -CaseSensitive ($env:ATOMIC_WINDOWS_DEBUG_SCOPE) {
            'all' { $atomicDebugFilter = 'test(managed_process::atomic_windows::tests::debug_session_runs_system_only_process_to_native_exit) | test(managed_process::atomic_windows::tests::debug_session_rejects_non_system_dynamic_image_before_continue) | test(managed_process::atomic_windows::tests::package_probe_rejects_unbound_child_and_confirms_cleanup) | test(managed_process::atomic_windows::tests::package_probe_cleans_up_before_initial_debug_event) | test(managed_process::atomic_windows::tests::package_probe_continue_failure_preserves_pending_cleanup) | test(managed_process::atomic_windows::tests::console_binding::)' }
            'stdio' { $atomicDebugFilter = 'test(=ai::cli_agent_runtime::managed_process::atomic_windows::tests::console_binding::npm_cmd_full_shim_bound_cmd_with_worker_stdio) | test(=ai::cli_agent_runtime::managed_process::atomic_windows::tests::console_binding::npm_fixed_node_root_with_worker_stdio) | test(=ai::cli_agent_runtime::managed_process::atomic_windows::tests::console_binding::npm_cmd_nul_redirection_runs_between_builtin_controls)' }
            'nul_token' { $atomicDebugFilter = 'test(=ai::cli_agent_runtime::managed_process::atomic_windows::tests::console_binding::npm_appcontainer_token_createfile_nul_vs_regular)' }
            'g09_tokens' { $atomicDebugFilter = 'test(=ai::cli_agent_runtime::managed_process::atomic_windows::tests::console_binding::npm_appcontainer_token_createfile_nul_vs_regular) | test(=ai::cli_agent_runtime::managed_process::atomic_windows::tests::console_binding::npm_fixed_node_root_with_existing_station_desktop)' }
            default { throw 'Windows 原生调试范围无效' }
          }
          if ($env:ATOMIC_WINDOWS_DEBUG_SCOPE -in @('all', 'nul_token', 'g09_tokens')) {
            # 小型测试映像仅由本次 checkout 的 C 源编译；缺 MSVC/SDK 时在诊断前停止。
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path -LiteralPath $vswhere)) { throw 'MSVC discovery tool is missing' }
            $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw 'MSVC x64 toolset is unavailable' }
            $vcvars = Join-Path $vsInstall.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path -LiteralPath $vcvars)) { throw 'MSVC x64 environment is missing' }
            $helperDirectory = Join-Path $env:RUNNER_TEMP ('infinishell-nul-helper-' + [guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $helperDirectory | Out-Null
            $helperSource = (Resolve-Path -LiteralPath 'app/src/ai/cli_agent_runtime/fixtures/windows_nul_createfile_helper.c').Path
            $helperObject = Join-Path $helperDirectory 'nul-createfile.obj'
            $helperExecutable = Join-Path $helperDirectory 'nul-createfile.exe'
            $buildScript = Join-Path $helperDirectory 'build-helper.cmd'
            foreach ($boundPath in @($vcvars, $helperDirectory, $helperSource)) {
              if ($boundPath -match '[%!"&|<>^]') { throw 'Win32 helper build path contains CMD metacharacters' }
            }
            @(
              '@echo off'
              "call `"$vcvars`" >nul || exit /b 1"
              "cl.exe /nologo /std:c11 /utf-8 /W4 /WX /GS- /Zl /c /Fo`"$helperObject`" `"$helperSource`" || exit /b 1"
              "link.exe /nologo /NODEFAULTLIB /ENTRY:ProbeMain /SUBSYSTEM:WINDOWS /MACHINE:X64 /OUT:`"$helperExecutable`" `"$helperObject`" kernel32.lib || exit /b 1"
            ) | Set-Content -LiteralPath $buildScript -Encoding ascii
            & cmd.exe /d /v:off /c "`"$buildScript`""
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $helperExecutable)) { throw 'Fixed Win32 CreateFile helper build failed' }
            $baselineDirectory = Join-Path $helperDirectory 'baseline'
            New-Item -ItemType Directory -Path $baselineDirectory | Out-Null
            $baselineOrdinary = Join-Path $baselineDirectory 'ordinary.txt'
            $baselineReport = Join-Path $baselineDirectory 'receipt.bin'
            [IO.File]::WriteAllBytes($baselineOrdinary, [byte[]](1))
            $previousReport = $env:INFINISHELL_WINDOWS_NUL_CREATEFILE_REPORT
            $previousOrdinary = $env:INFINISHELL_WINDOWS_NUL_CREATEFILE_ORDINARY
            try {
              $env:INFINISHELL_WINDOWS_NUL_CREATEFILE_REPORT = $baselineReport
              $env:INFINISHELL_WINDOWS_NUL_CREATEFILE_ORDINARY = $baselineOrdinary
              $baselineProcess = Start-Process -FilePath $helperExecutable -WorkingDirectory $baselineDirectory -Wait -PassThru
              if ($baselineProcess.ExitCode -ne 0) { throw 'Fixed Win32 CreateFile helper baseline exited abnormally' }
              $baselineBytes = [IO.File]::ReadAllBytes($baselineReport)
              if ($baselineBytes.Length -ne 120 -or
                  [BitConverter]::ToUInt32($baselineBytes, 0) -ne 0x4e554c31 -or
                  [BitConverter]::ToUInt32($baselineBytes, 24) -ne 1 -or
                  [BitConverter]::ToUInt32($baselineBytes, 36) -ne 1 -or
                  [BitConverter]::ToUInt32($baselineBytes, 72) -ne 1 -or
                  [BitConverter]::ToUInt32($baselineBytes, 84) -ne 1) { throw 'Fixed Win32 CreateFile helper baseline receipt is invalid' }
            } finally {
              [Environment]::SetEnvironmentVariable('INFINISHELL_WINDOWS_NUL_CREATEFILE_REPORT', $previousReport, 'Process')
              [Environment]::SetEnvironmentVariable('INFINISHELL_WINDOWS_NUL_CREATEFILE_ORDINARY', $previousOrdinary, 'Process')
            }
            $env:INFINISHELL_WINDOWS_NUL_CREATEFILE_HELPER = $helperExecutable
            $env:INFINISHELL_WINDOWS_NUL_CREATEFILE_HELPER_SHA256 = (Get-FileHash -LiteralPath $helperExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
            $helperSourceSha256 = (Get-FileHash -LiteralPath $helperSource -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "atomic_windows_createfile_helper_baseline=true source_sha256=$helperSourceSha256 helper_sha256=$env:INFINISHELL_WINDOWS_NUL_CREATEFILE_HELPER_SHA256"
          }
          # 只向显式原生对照传入已安装的固定 Node；候选仍复制到私有目录并核摘要。
          $nodeControl = (Get-Command node.exe -CommandType Application).Source
          $nodeControlVersion = & $nodeControl --version
          if ($LASTEXITCODE -ne 0 -or $nodeControlVersion.Trim() -ne 'v20.9.0') { throw 'Fixed Node control version mismatch' }
          $env:INFINISHELL_WINDOWS_NODE_CONTROL = $nodeControl
          $env:INFINISHELL_WINDOWS_NODE_CONTROL_SHA256 = (Get-FileHash -LiteralPath $nodeControl -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT = Join-Path $env:RUNNER_TEMP ('infinishell-node-control-' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT | Out-Null
          "INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT=$env:INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "atomic_windows_node_control_source_version=$nodeControlVersion sha256=$env:INFINISHELL_WINDOWS_NODE_CONTROL_SHA256"
          cargo nextest run --no-fail-fast --retries 0 -p warp --lib -E 'test(managed_process::atomic_windows::loader_tests::) | test(managed_process::atomic_windows::environment_tests::) | test(managed_process::atomic_windows::tests::console_binding::private_desktop_failure_)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --no-fail-fast --retries 0 --success-output immediate -p warp --lib --run-ignored only -E $atomicDebugFilter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve Windows Node stdio control evidence
        if: ${{ !cancelled() && inputs.run_atomic_windows_debug && inputs.windows_atomic_debug_scope != 'nul_token' && steps.atomic_windows_debug.outcome != 'skipped' && env.INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-node-stdio-controls-${{ github.sha }}
          path: |
            ${{ env.INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT }}/**/*.safe.json
            ${{ env.INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT }}/**/*.stdout
            ${{ env.INFINISHELL_WINDOWS_NODE_CONTROL_OUTPUT }}/**/*.stderr
          if-no-files-found: error
          retention-days: 14

      # 使用同一提交构建的真实 worker；内部夹具和模型网络验收不混入此筛选。
      - name: Build CLI process supervisor
        id: supervisor
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests || inputs.run_cli_atomic_updates || inputs.run_windows_codex_npm_updates) && (!cancelled() && steps.check_app.outcome == 'success') }}
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          $arguments = @('build', '-p', 'warp_tui', '--bin', 'infinishell-tui', '-p', 'command', '--bin', 'infinishell-station-bootstrap')
          if ('${{ inputs.run_windows_npm_native_witness }}' -eq 'true') { $arguments += @('--features', 'warp/cli-agent-native-witness,command/native-probe-witness') }
          cargo @arguments

      # 固定夹具与真实 PS 分开调度；此处只构建同提交 reader，不自动执行夹具。
      - name: Build reader for the authorized PowerShell npm observation
        id: ps_clr_reader
        if: ${{ !cancelled() && inputs.windows_atomic_debug_scope == 'g09_npm_powershell' && inputs.run_windows_npm_native_witness && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: powershell
        run: ./script/ci/g09-clr-fixture/build-reader.ps1

      - name: Preserve PowerShell npm reader build evidence
        if: ${{ always() && inputs.windows_atomic_debug_scope == 'g09_npm_powershell' && (steps.ps_clr_reader.outcome == 'success' || steps.ps_clr_reader.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-g09-npm-clr-reader-${{ github.sha }}
          path: ${{ runner.temp }}/g09-clr-build-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

      # 真实 npm 生成私有安装登记和入口；不改写用户前缀、凭据或执行策略。
      - name: Verify fixed Windows Codex npm update transactions without credentials
        id: codex_npm_updates
        if: ${{ !cancelled() && inputs.run_windows_codex_npm_updates && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success' && steps.native_python.outcome == 'success' && steps.native_node.outcome == 'success' && (inputs.windows_atomic_debug_scope != 'g09_npm_powershell' || steps.ps_clr_reader.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 45
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('test', '-p', 'warp', '--lib', '--no-run', '--message-format=json-render-diagnostics')
          if ('${{ inputs.run_windows_npm_native_witness }}' -eq 'true') { $arguments += @('--features', 'cli-agent-native-witness') }
          $buildMessages = cargo @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit warp libtest discovery failed' }
          $executables = @($buildMessages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'warp' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected exactly one same-commit warp libtest executable' }
          if ('${{ inputs.run_windows_npm_native_witness }}' -eq 'true') {
            $unitBinary = $executables[0]
            $listedTests = @(& $unitBinary --list)
            if ($LASTEXITCODE -ne 0) { throw 'Witness unit test discovery failed' }
            foreach ($filter in @('atomic_windows::native_snapshot::tests::', 'atomic_windows::native_snapshot::temp_path::tests::', 'atomic_windows::creation_witness::tests::', 'atomic_windows::native_witness::tests::', 'atomic_windows::native_clr::tests::', 'managed_process::tests::native_witness_', 'sources::claude_downgrade::tests::', 'sources::npm_windows::live_tests::windows_npm_witness_')) {
              if (@($listedTests | Where-Object { $_.Contains($filter) -and $_.EndsWith(': test') }).Count -eq 0) { throw "Missing witness unit group: $filter" }
              & $unitBinary $filter --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "Witness unit group failed: $filter" }
            }
          }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit supervisor lookup failed' }
          $parityFixture = Join-Path $env:RUNNER_TEMP ('infinishell-codex-npm-' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $parityFixture | Out-Null
          $evidence = Join-Path $parityFixture 'evidence'
          "WINDOWS_CODEX_NPM_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $testBinary = Join-Path $parityFixture 'warp-libtest.exe'
          $supervisor = Join-Path $parityFixture 'supervisor.exe'
          $stationBootstrap = Join-Path $parityFixture 'infinishell-station-bootstrap.exe'
          "WINDOWS_STATION_BOOTSTRAP_EVIDENCE=$stationBootstrap" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sourceSupervisor = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          $sourceBootstrap = Join-Path $metadata.target_directory 'debug/infinishell-station-bootstrap.exe'
          Copy-Item -LiteralPath $executables[0] -Destination $testBinary
          Copy-Item -LiteralPath $sourceSupervisor -Destination $supervisor
          Copy-Item -LiteralPath $sourceBootstrap -Destination $stationBootstrap
          function Get-ParityDigest([string] $path) {
            return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ((Get-ParityDigest $testBinary) -ne (Get-ParityDigest $executables[0])) { throw 'Copied libtest hash mismatch' }
          if ((Get-ParityDigest $supervisor) -ne (Get-ParityDigest $sourceSupervisor)) { throw 'Copied supervisor hash mismatch' }
          if ((Get-ParityDigest $stationBootstrap) -ne (Get-ParityDigest $sourceBootstrap)) { throw 'Copied station bootstrap hash mismatch' }
          $nodePath = (Get-Command node.exe -CommandType Application).Source
          $npmPath = Join-Path (Split-Path -Parent $nodePath) 'node_modules/npm/bin/npm-cli.js'
          if (-not (Test-Path -LiteralPath $npmPath -PathType Leaf)) { throw 'Fixed Node npm entry is missing' }
          $witnessArguments = @()
          if ('${{ inputs.run_windows_npm_native_witness }}' -eq 'true') {
            $witnessMode = 'cmd'
            if ('${{ inputs.windows_atomic_debug_scope }}' -eq 'g09_npm_powershell') { $witnessMode = 'powershell' }
            $witnessArguments = @('--native-witness', '--native-witness-mode', $witnessMode, '--case', 'updated')
            if ($witnessMode -eq 'powershell') {
              if ([string]::IsNullOrWhiteSpace($env:INFINISHELL_CLR_READER)) { throw 'Same-commit CLR reader is missing' }
              $witnessArguments += @('--clr-reader', $env:INFINISHELL_CLR_READER, '--clr-reader-sha256', (Get-ParityDigest $env:INFINISHELL_CLR_READER))
            }
          }
          python -B script/cli-agent-parity/run_codex_npm_windows_update_live.py --repo "$env:GITHUB_WORKSPACE" --output $evidence --test-binary $testBinary --test-binary-sha256 (Get-ParityDigest $testBinary) --supervisor $supervisor --supervisor-sha256 (Get-ParityDigest $supervisor) --station-bootstrap $stationBootstrap --station-bootstrap-sha256 (Get-ParityDigest $stationBootstrap) --node $nodePath --node-sha256 (Get-ParityDigest $nodePath) --npm-cli $npmPath --npm-cli-sha256 (Get-ParityDigest $npmPath) @witnessArguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows Codex npm transaction failed; original receipts are preserved' }

      - name: Preserve Windows Codex npm update receipts
        if: ${{ !cancelled() && inputs.run_windows_codex_npm_updates && steps.codex_npm_updates.outcome != 'skipped' && env.WINDOWS_CODEX_NPM_EVIDENCE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-codex-npm-updates-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/*.safe.json
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/*.metadata.json
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/*-metadata.json
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/*.tgz
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/*.stdout
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/*.stderr
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/before-config.raw
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/journal/codex-npm-windows.json
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/cli-agent-processes/**/*.json
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/cli-agent-processes/**/*.log
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/cli-agent-processes/**/appcontainer-cleanup-v1
            ${{ env.WINDOWS_CODEX_NPM_EVIDENCE }}/**/claude-npm-version-*/station-*/*.json
            ${{ env.WINDOWS_STATION_BOOTSTRAP_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

      # Windows 仍走已有严格 Job 调试候选，实际执行固定 update/install，并核对退出和新入口。
      - name: Verify fixed Windows CLI atomic update candidates without credentials
        id: fixed_cli_atomic_updates
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests || inputs.run_cli_atomic_updates) && (!cancelled() && inputs.run_cli_atomic_updates && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 40
        env:
          PYTHONUTF8: "1"
          ATOMIC_AGENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_grok_installer_only && !inputs.full_workspace_tests && inputs.windows_atomic_agent != 'all' && inputs.windows_atomic_agent || 'codex claude grok' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildMessages = cargo test -p warp --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit warp libtest discovery failed' }
          $executables = @($buildMessages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'warp' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected exactly one same-commit warp libtest executable' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit supervisor lookup failed' }
          $worker = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          $fixtureParent = Join-Path $env:RUNNER_TEMP ('infinishell-fixed-cli-updates-' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $fixtureParent | Out-Null
          $atomicAgents = $env:ATOMIC_AGENTS.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          python -B script/cli-agent-parity/run_fixed_cli_autoupdate.py --test-binary $executables[0] --supervisor $worker --fixture-parent $fixtureParent --cache "$env:RUNNER_TEMP\fixed-cli-atomic-inputs" --output "$env:RUNNER_TEMP\fixed-cli-atomic-evidence\summary.safe.json" --agents @atomicAgents
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native update candidate failed; inspect safe receipts; production gates remain closed' }

      - name: Preserve Windows fixed CLI atomic update receipts
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests || inputs.run_cli_atomic_updates) && (!cancelled() && steps.fixed_cli_atomic_updates.outcome != 'skipped') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-fixed-atomic-updates-${{ github.sha }}
          path: ${{ runner.temp }}/fixed-cli-atomic-evidence/*.safe.json
          if-no-files-found: error
          retention-days: 14

      - name: Test supervisor cleanup after host crash
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests || inputs.run_cli_atomic_updates) && (!cancelled() && steps.check_app.outcome == 'success' && steps.supervisor.outcome == 'success') }}
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:INFINISHELL_CLI_SUPERVISOR_EXECUTABLE = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          cargo nextest run --no-fail-fast -p warp --lib --run-ignored only -E 'test(managed_process::live_tests::supervised_)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native recovery and idle-crash boundaries without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && steps.fixed_codex.outcome == 'success' && steps.supervisor.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 15
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $buildMessages = cargo test -p warp --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit warp test build failed' }
          $executables = @($buildMessages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'warp' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected exactly one warp libtest executable' }
          $worker = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          python -B script/cli-agent-parity/run_codex_adapter_live.py --test-case missing-session --test-binary $executables[0] --codex "$env:INFINISHELL_TEST_CODEX_EXE" --supervisor $worker --output "$env:RUNNER_TEMP\codex-missing-session.ndjson"
          if ($LASTEXITCODE -ne 0) { throw 'Native missing-session recovery validation failed' }
          python -B script/cli-agent-parity/run_codex_adapter_live.py --test-case idle-crash --test-binary $executables[0] --codex "$env:INFINISHELL_TEST_CODEX_EXE" --supervisor $worker --output "$env:RUNNER_TEMP\codex-idle-crash.ndjson"
          if ($LASTEXITCODE -ne 0) { throw 'Native idle-crash boundary validation failed' }
          # 实际穿过 Rust 启动器、cmd 包装及同提交监督 worker，不能只检验字符串转义。
          $shimDirectory = Join-Path $env:RUNNER_TEMP ('codex shim 中文 & path-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $shimDirectory | Out-Null
          Copy-Item -LiteralPath $env:INFINISHELL_TEST_CODEX_EXE -Destination (Join-Path $shimDirectory 'codex-native.exe')
          $shim = Join-Path $shimDirectory 'codex.cmd'
          $shimContents = '@echo off' + "`r`n" + '"%~dp0codex-native.exe" %*' + "`r`n" + 'exit /b %errorlevel%' + "`r`n"
          [System.IO.File]::WriteAllText($shim, $shimContents, [System.Text.Encoding]::ASCII)
          python -B script/cli-agent-parity/run_codex_adapter_live.py --test-case missing-session --test-binary $executables[0] --codex $shim --supervisor $worker --output "$env:RUNNER_TEMP\codex-missing-session-cmd.ndjson"
          if ($LASTEXITCODE -ne 0) { throw 'Native cmd shim missing-session recovery validation failed' }

      - name: Verify fixed Grok production supervised cleanup without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && steps.fixed_grok.outcome == 'success' && steps.supervisor.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 15
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $buildMessages = cargo test -p warp --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit warp test build failed' }
          $executables = @($buildMessages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'warp' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected exactly one warp libtest executable' }
          $worker = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          python -B script/cli-agent-parity/run_grok_supervised_exit.py --test-binary $executables[0] --grok "$env:INFINISHELL_TEST_GROK_EXE" --supervisor $worker --output "$env:RUNNER_TEMP\grok-supervised-exit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok production supervised cleanup failed' }

      - name: Preserve Windows native CLI boundary evidence
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled())) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-native-boundaries-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-plugin-lifecycle.json
            ${{ runner.temp }}/codex-plugin-cache-refresh.json
            ${{ runner.temp }}/codex-missing-session*
            ${{ runner.temp }}/codex-idle-crash.*
            ${{ runner.temp }}/claude-initialize-idle-eof.json
            ${{ runner.temp }}/claude-permission-observation.json
            ${{ runner.temp }}/claude-21280-inputs/claude-fixed-inputs.json
            ${{ runner.temp }}/grok-cli-fixed/grok-fixed-inputs.json
            ${{ runner.temp }}/grok-fixed-acp.json
            ${{ runner.temp }}/grok-supervised-exit.json
          if-no-files-found: error
          retention-days: 14

      - name: Test MCP, Vim, and POSIX completion
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests) }}
        shell: pwsh
        run: cargo nextest run --locked --no-fail-fast -p mcp -p ai -p vim -p warp_completer

      - name: Test completion v2 compatibility
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.full_workspace_tests) }}
        shell: pwsh
        run: cargo nextest run --locked --no-fail-fast -p warp_completer --features v2

      - name: Test desktop and TUI input regressions
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && !cancelled() && steps.check_app.outcome == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.native_acceptance_only || inputs.run_grok_native_bridge_host || inputs.full_workspace_tests) }}
        shell: pwsh
        run: >-
          cargo nextest run --locked --no-fail-fast -p warp -p warp_tui --lib --features warpui/test-util
          -E 'test(vim) | test(model_selector_keybinding_ignores_closed_selector_window) | test(context_menu) | test(stale_tab_index) | test(mcp) | test(batch_command_view) | test(json_tree) | test(cache_stability) | test(view_components::dismissible_toast::tests::) | test(i18n::tests)'

      - name: Test rust-genai
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.windows_toolchain.outcome == 'success') }}
        shell: pwsh
        run: cargo test --manifest-path lib/rust-genai/Cargo.toml --lib

      - name: Compile GUI integration tests
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.full_workspace_tests || inputs.run_gui_clipboard)) }}
        shell: pwsh
        run: cargo nextest run --no-run -p integration

      - name: Verify Windows GUI system clipboard without model inputs
        id: cli_gui_input
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.full_workspace_tests || inputs.run_gui_clipboard)) }}
        shell: pwsh
        timeout-minutes: 15
        env:
          WARP_INTEGRATION: "1"
          WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: "1"
          WARP_TEST_GUI_SOURCE_COMMIT: ${{ github.sha }}
          WARP_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/gui-input-evidence/windows
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p integration --bin integration
          if ($LASTEXITCODE -ne 0) { throw 'GUI integration binary compilation failed' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GUI integration binary discovery failed' }
          $binary = Join-Path $metadata.target_directory 'debug\integration.exe'
          ./script/cli-agent-parity/run_windows_gui_clipboard.ps1 -Binary $binary

      - name: Preserve Windows GUI system clipboard evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && (steps.cli_gui_input.outcome == 'success' || steps.cli_gui_input.outcome == 'failure')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-gui-system-clipboard-${{ github.sha }}
          path: ${{ runner.temp }}/gui-input-evidence/windows
          if-no-files-found: error
          retention-days: 14

      - name: Verify Windows fixed Grok bilingual static viewport
        id: grok_static_viewport
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && steps.fixed_grok.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_grok_viewport_static }}
        shell: pwsh
        timeout-minutes: 30
        env:
          WARP_TEST_GUI_SOURCE_COMMIT: ${{ github.sha }}
          WARP_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/gui-grok-view-evidence/windows
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p integration --bin integration
          if ($LASTEXITCODE -ne 0) { throw 'Grok GUI integration binary compilation failed' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Grok GUI integration binary discovery failed' }
          $binary = Join-Path $metadata.target_directory 'debug\integration.exe'
          ./script/cli-agent-parity/run_windows_grok_static_viewport.ps1 -Binary $binary

      - name: Preserve Windows fixed Grok static viewport evidence
        if: ${{ !cancelled() && (steps.grok_static_viewport.outcome == 'success' || steps.grok_static_viewport.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-grok-static-viewport-${{ github.sha }}
          path: ${{ runner.temp }}/gui-grok-view-evidence/windows
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Windows fixed Grok bilingual synthetic approval viewport
        id: grok_approval_viewport
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && steps.fixed_grok.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_grok_viewport_approval_synthetic }}
        shell: pwsh
        timeout-minutes: 30
        env:
          WARP_TEST_GUI_SOURCE_COMMIT: ${{ github.sha }}
          WARP_INTEGRATION_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/gui-grok-approval-evidence/windows
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p integration --bin integration
          if ($LASTEXITCODE -ne 0) { throw 'Grok synthetic approval GUI integration binary compilation failed' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Grok synthetic approval GUI integration binary discovery failed' }
          $binary = Join-Path $metadata.target_directory 'debug\integration.exe'
          ./script/cli-agent-parity/run_windows_grok_approval_viewport.ps1 -Binary $binary

      - name: Preserve Windows fixed Grok synthetic approval viewport evidence
        if: ${{ !cancelled() && (steps.grok_approval_viewport.outcome == 'success' || steps.grok_approval_viewport.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-grok-approval-viewport-${{ github.sha }}
          path: ${{ runner.temp }}/gui-grok-approval-evidence/windows
          if-no-files-found: warn
