name: Cross-platform preflight

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:
    inputs:
      run_linux:
        description: Run the Linux self-hosted job
        required: true
        default: true
        type: boolean
      run_windows:
        description: Run the Windows self-hosted job
        required: true
        default: true
        type: boolean
      run_macos_intel:
        description: 备用：交叉构建并原生验证 macOS x86_64 SSH 扩展
        required: true
        default: false
        type: boolean
      full_workspace_tests:
        description: Compile GUI integration tests and run the desktop workspace unit suite
        required: true
        default: false
        type: boolean
      native_acceptance_only:
        description: 仅补验原生 CLI 安装升级和 GUI；全量模式优先
        required: true
        default: false
        type: boolean
      source_gate_only:
        description: 仅运行完整普通源码门禁及自建辅助回归；不覆盖已知原生失败或关闭缺口
        required: true
        default: false
        type: boolean
      run_gui_clipboard:
        description: 单独复验真实 GUI 系统剪贴板，不重复完整工作区测试
        required: true
        default: false
        type: boolean
      run_grok_viewport_static:
        description: 单独采集 Linux/Windows 固定 Grok 英中静态视口，审批仍待在线验收
        required: true
        default: false
        type: boolean
      run_grok_viewport_approval_synthetic:
        description: 采集 Linux/Windows 固定 Grok 英中合成审批视口与按钮动作，原生审批另验
        required: true
        default: false
        type: boolean
      run_grok_native_bridge_host:
        description: 验证普通 Grok 宿主、生产 ConPTY 辅助程序及输入回归，不重建原生工件
        required: true
        default: false
        type: boolean
      run_grok_native_bridge_source:
        description: 从受审公开源码构建 Linux/Windows 普通 Grok 原子桥并保存独立工件
        required: true
        default: false
        type: boolean
      grok_native_source_capability:
        description: 原生构建能力；通知扩展使用独立补丁和工件，不替换已验原子桥
        required: true
        default: terminal-bridge
        type: choice
        options:
          - terminal-bridge
          - session-notifications
      run_claude_image_regression:
        description: Linux/Windows 定向运行 Claude 图片格式、纯图及图片加技能离线回归
        required: true
        default: false
        type: boolean
      linux_gui_only:
        description: 仅补验 Linux 真实 GUI 系统剪贴板；全量模式优先
        required: true
        default: false
        type: boolean
      windows_grok_installer_only:
        description: 默认仅补验 Windows Grok 安装器；开启原子更新时附加所选 CLI 更新；全量模式优先
        required: true
        default: false
        type: boolean
      run_cli_atomic_updates:
        description: 固定 0.156.1 / 2.1.280 / 1.0.41 的隔离真实原子更新候选
        required: true
        default: false
        type: boolean
      run_claude_npm_updates:
        description: Linux 私有 npm 安装的 Claude 2.1.280 后端更新事务及中断恢复
        required: true
        default: false
        type: boolean
      run_codex_npm_updates:
        description: Linux 私有 npm 安装的 Codex 0.156.1 后端更新事务及中断恢复
        required: true
        default: false
        type: boolean
      run_windows_codex_npm_updates:
        description: Windows 私有 npm 安装的 Codex 0.156.1 公共入口更新及中断恢复
        required: true
        default: false
        type: boolean
      run_windows_npm_native_witness:
        description: 仅固定 Codex npm 首个选定模式候选的取消前原生取证；不计完整验收
        required: true
        default: false
        type: boolean
      run_grok_npm_updates:
        description: Linux 私有 npm 安装的 Grok 1.0.41 后端更新事务及中断恢复
        required: true
        default: false
        type: boolean
      run_atomic_windows_debug:
        description: Diagnose bounded native Windows image-debug exit and rejection
        required: true
        default: false
        type: boolean
      windows_atomic_debug_scope:
        description: 专项范围；upstream_essence 仅验上游精华，g09_clr_fixture 验固定 CLR，g09_npm_powershell 选择首 PS 快照
        required: true
        default: all
        type: choice
        options:
          - all
          - upstream_essence
          - stdio
          - nul_token
          - g09_tokens
          - g09_netcredentials
          - g09_stdio_lifetime
          - codex_hooks
          - g09_image_contract
          - g09_powershell_contract
          - g09_clr_fixture
          - g09_npm_powershell
      windows_atomic_agent:
        description: Windows Grok 安装器专项附加升级对象；默认、原生和全量模式仍验三款
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - claude
          - grok
      linux_atomic_agent:
        description: 原生补验模式的 Linux 升级对象；claude_musl 仅用于独立 Claude npm musl 验收
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - claude
          - grok
          - claude_musl
# 自托管 runner 只需要读取代码。这个 workflow 不接收部署密钥，也不向仓库写入内容。
permissions:
  contents: read

concurrency:
  group: cross-platform-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate_scope:
    name: Validate verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 独立前置 job 阻止冲突模式进入含 !cancelled() 条件的后续步骤。
      - name: Reject conflicting source-only inputs
        shell: bash
        env:
          PREFLIGHT_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["PREFLIGHT_INPUTS"])
          if inputs.get("windows_atomic_debug_scope") == "upstream_essence" and not inputs.get("full_workspace_tests", False):
              allowed = {"run_linux", "run_windows", "windows_atomic_debug_scope"}
              defaults = {"grok_native_source_capability": "terminal-bridge", "windows_atomic_agent": "all", "linux_atomic_agent": "all"}
              conflicts = [name for name, value in inputs.items() if name not in allowed and (value if isinstance(value, bool) else defaults.get(name) != value)]
              if conflicts:
                  sys.exit("上游精华验证不能与其他专项混用：" + ", ".join(sorted(conflicts)))
              if not (inputs.get("run_linux", False) or inputs.get("run_windows", False)):
                  sys.exit("上游精华验证至少选择 Linux 或 Windows 一个平台")
          if inputs.get("linux_atomic_agent") == "claude_musl":
              required = {"run_linux", "native_acceptance_only", "run_claude_npm_updates"}
              defaults = {"grok_native_source_capability": "terminal-bridge", "windows_atomic_debug_scope": "all", "windows_atomic_agent": "all"}
              conflicts = [name for name, value in inputs.items() if name not in required | {"linux_atomic_agent"} and (value if isinstance(value, bool) else defaults.get(name) != value)]
              if conflicts or not all(inputs.get(name) is True for name in required):
                  sys.exit("Claude npm musl 验收只允许独立 Linux 原生补验，其他开关必须关闭或保持默认：" + ", ".join(sorted(conflicts)))
          if inputs.get("windows_atomic_debug_scope") == "g09_npm_powershell" and not inputs.get("run_windows_npm_native_witness", False):
              sys.exit("PowerShell 原生取证范围必须显式开启限定 witness")
          if inputs.get("windows_atomic_debug_scope") == "g09_stdio_lifetime":
              required = {"run_windows", "run_atomic_windows_debug"}
              defaults = {"grok_native_source_capability": "terminal-bridge", "windows_atomic_agent": "all", "linux_atomic_agent": "all"}
              conflicts = [name for name, value in inputs.items() if name not in required | {"windows_atomic_debug_scope"} and (value if isinstance(value, bool) else defaults.get(name) != value)]
              if conflicts or not all(inputs.get(name, False) for name in required):
                  sys.exit("标准流生命周期对照只允许单独 Windows 限定范围：" + ", ".join(sorted(conflicts)))
          if inputs.get("windows_atomic_debug_scope") in {"g09_image_contract", "g09_powershell_contract", "g09_clr_fixture"}:
              required = {"run_windows"}
              defaults = {"grok_native_source_capability": "terminal-bridge", "windows_atomic_agent": "all", "linux_atomic_agent": "all"}
              conflicts = [name for name, value in inputs.items() if name not in required | {"windows_atomic_debug_scope"} and (value if isinstance(value, bool) else defaults.get(name) != value)]
              if conflicts or inputs.get("run_windows") is not True:
                  sys.exit("固定 Windows 实现验证只允许单独 Windows，其他开关必须关闭或保持默认：" + ", ".join(sorted(conflicts)))
          if inputs.get("windows_atomic_debug_scope") == "codex_hooks":
              required = {"run_windows", "run_atomic_windows_debug"}
              defaults = {"grok_native_source_capability": "terminal-bridge", "windows_atomic_agent": "all", "linux_atomic_agent": "all"}
              conflicts = [name for name, value in inputs.items() if name not in required | {"windows_atomic_debug_scope"} and (value if isinstance(value, bool) else defaults.get(name) != value)]
              if conflicts or not all(inputs.get(name, False) for name in required):
                  sys.exit("固定 Codex hooks 复验只允许单独 Windows 范围：" + ", ".join(sorted(conflicts)))
          if inputs.get("run_windows_npm_native_witness", False):
              required = {"run_windows", "windows_grok_installer_only", "run_windows_codex_npm_updates", "run_windows_npm_native_witness"}
              defaults = {"grok_native_source_capability": "terminal-bridge", "windows_atomic_debug_scope": "g09_npm_powershell" if inputs.get("windows_atomic_debug_scope") == "g09_npm_powershell" else "all", "windows_atomic_agent": "all", "linux_atomic_agent": "all"}
              conflicts = [name for name, value in inputs.items() if name not in required and (value if isinstance(value, bool) else defaults.get(name) != value)]
              if conflicts or not all(inputs.get(name, False) for name in required):
                  sys.exit("原生取证只允许单独 Windows 首个选定模式范围：" + ", ".join(sorted(conflicts)))
          if not inputs.get("source_gate_only", False):
              sys.exit(0)
          allowed = {"source_gate_only", "run_linux", "run_windows"}
          defaults = {
              "grok_native_source_capability": "terminal-bridge",
              "windows_atomic_debug_scope": "all",
              "windows_atomic_agent": "all",
              "linux_atomic_agent": "all",
          }
          conflicts = [
              name for name, value in inputs.items()
              if name not in allowed
              and (value if isinstance(value, bool) else name not in defaults or defaults[name] != value)
          ]
          if conflicts:
              sys.exit("源码门禁不能与专项、原生、GUI 或全量模式混用：" + ", ".join(sorted(conflicts)))
          if not (inputs.get("run_linux", False) or inputs.get("run_windows", False)):
              sys.exit("源码门禁至少选择 Linux 或 Windows 一个平台")
          PY

  upstream_essence:
    name: 上游精华 / ${{ matrix.platform }} x64
    needs: validate_scope
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.windows_atomic_debug_scope == 'upstream_essence' && !inputs.full_workspace_tests
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.run_linux && inputs.run_windows && '["linux","windows"]' || inputs.run_windows && '["windows"]' || '["linux"]') }}
    runs-on: [self-hosted, '${{ matrix.platform }}', x64, infinishell-ci]
    timeout-minutes: 180
    env:
      APP_FEATURES: release_bundle,warpui/test-util,rust-embed/debug-embed
      APP_FILTER: >-
        test(ai::mcp::) | test(call_mcp_tool::) |
        test(history_up_does_not_reenter_inline_history_menu_update) |
        test(editor_down_does_not_reenter_inline_history_menu_update) |
        test(undo_close::stack::tests::) |
        test(settings_error_sync_) |
        test(notebooks::notebook::tests::test_command_block_dispatches_event) |
        test(context_chips::directory_fetcher::tests::) |
        test(terminal::input::slash_commands::tests::) |
        test(aborting_remote_run_command_kills_process_and_clears_in_progress_request) |
        test(terminal::cli_agent_sessions::plugin_manager::) |
        test(i18n::tests) | test(app_services::linux::startup_tests::) |
        test(app_services::windows::startup_tests::)
    steps:
      # 全量模式在 job 条件中优先；其余专项冲突直接失败，避免悄悄漏验。
      - name: 校验精简模式输入
        shell: bash
        env:
          RUN_LINUX: ${{ inputs.run_linux }}
          RUN_WINDOWS: ${{ inputs.run_windows }}
          OTHER_SPECIALIZED_MODE: ${{ inputs.run_macos_intel || inputs.native_acceptance_only || inputs.run_gui_clipboard || inputs.linux_gui_only || inputs.windows_grok_installer_only || inputs.run_cli_atomic_updates || inputs.run_claude_npm_updates || inputs.run_codex_npm_updates || inputs.run_windows_codex_npm_updates || inputs.run_grok_npm_updates || inputs.run_atomic_windows_debug }}
        run: |
          set -euo pipefail
          if [[ "$RUN_LINUX" != true && "$RUN_WINDOWS" != true ]]; then
            echo '::error::精简模式至少选择 run_linux 或 run_windows。'
            exit 1
          fi
          if [[ "$OTHER_SPECIALIZED_MODE" == true ]]; then
            echo '::error::upstream_essence 不可与其他专项模式同时开启。'
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 仅设置当前作业环境，复用已部署的 Perl、LLVM 与构建缓存。
      - name: 配置 Windows 已部署工具链
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $strawberryPerl = 'C:\Strawberry\perl\bin\perl.exe'
          $libclang = 'C:\Program Files\LLVM\bin'
          $sccache = 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
          foreach ($required in @($strawberryPerl, (Join-Path $libclang 'libclang.dll'), $sccache)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "已部署工具链缺失：$required"
            }
          }
          'C:\Strawberry\perl\bin', $libclang | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          @(
            "OPENSSL_SRC_PERL=$strawberryPerl"
            "LIBCLANG_PATH=$libclang"
            'CARGO_TARGET_DIR=C:\infinishell-ci\cargo-target'
            "RUSTC_WRAPPER=$sccache"
            'SCCACHE_DIR=C:\infinishell-ci\sccache'
            'SCCACHE_CACHE_SIZE=80G'
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 核对测试提交与工具链
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/upstream-essence"
          if [[ "$RUNNER_OS" == Windows ]]; then
            log_dir="$(cygpath -u "$RUNNER_TEMP")/upstream-essence"
          fi
          mkdir -p "$log_dir"
          echo "UPSTREAM_ESSENCE_LOG_DIR=$log_dir" >> "$GITHUB_ENV"
          {
            actual_sha="$(git rev-parse HEAD)"
            echo "expected_sha=$GITHUB_SHA"
            echo "actual_sha=$actual_sha"
            test "$actual_sha" = "$GITHUB_SHA"
            git --version
            rustc --version
            cargo --version
            cargo nextest --version
            cmake --version
            protoc --version
          } 2>&1 | tee "$log_dir/toolchain.log"

      - name: 检查主应用及启动条件编译
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "cargo check --locked -p warp --features $APP_FEATURES"
            cargo check --locked -p warp --features "$APP_FEATURES"
          } 2>&1 | tee "$UPSTREAM_ESSENCE_LOG_DIR/cargo-check.log"

      - name: 准备 Windows 作业内 Python
        id: windows_notification_python
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/prepare_windows_python.ps1

      - name: 准备 Linux 固定 Python
        id: linux_notification_python
        if: ${{ matrix.platform == 'linux' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 10
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
          update-environment: true

      - name: 验证 Codex 通知安装事务与真实终端传输
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            python=python
          fi
          modules=(notification_patch_tests codex_persistent_source_tests codex_windows_hook_tests codex_windows_notify_tests)
          if [[ "$RUNNER_OS" == Windows ]]; then
            modules+=(codex_native_windows_notification_tests)
          else
            modules+=(codex_detached_notification_tests tmux_notification_tests)
          fi
          # 收齐独立用例的失败，不因首项失败掩盖其余平台证据。
          "$python" -B -c 'import sys, unittest; sys.path.insert(0, "script/cli-agent-parity"); unittest.main(module=None)' \
            "${modules[@]}" -v 2>&1 | tee "$UPSTREAM_ESSENCE_LOG_DIR/codex-notifications.log"

      - name: 采集 Unix 正式 Codex Hook 信任摘要
        if: ${{ !cancelled() && matrix.platform == 'linux' && steps.linux_notification_python.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          codex_executable="$(python3 -B script/cli-agent-parity/prepare_codex_cli.py --version 0.156.1 --download-dir "$RUNNER_TEMP/codex-notification-inputs")"
          python3 -B script/cli-agent-parity/probe_codex_hook_trust.py \
            --codex-version 0.156.1 --codex-executable "$codex_executable" \
            --output "$UPSTREAM_ESSENCE_LOG_DIR/codex-hook-trust-0.156.1.json"

      - name: 采集 Windows 正式 Codex Hook 信任摘要
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.windows_notification_python.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in @('0.147.0', '0.156.1')) {
            $codexExecutable = python -B script/cli-agent-parity/prepare_codex_cli.py --version $version --download-dir "$env:RUNNER_TEMP\codex-notification-$version"
            if ($LASTEXITCODE -ne 0) { throw '固定 Codex 准备失败' }
            python -B script/cli-agent-parity/probe_codex_hook_trust.py --codex-version $version --codex-executable $codexExecutable --output "$env:RUNNER_TEMP\upstream-essence\codex-hook-trust-$version.json"
            if ($LASTEXITCODE -ne 0) { throw '正式 Hook 信任摘要采集失败' }
          }

      - name: 测试 MCP、远程请求取消、路径工具与默认补全
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'cargo nextest run --locked --no-fail-fast --no-tests fail --retries 0 -p mcp -p remote_server -p warp_util -p warp_completer --lib'
            cargo nextest run --locked --no-fail-fast --no-tests fail --retries 0 -p mcp -p remote_server -p warp_util -p warp_completer --lib
          } 2>&1 | tee "$UPSTREAM_ESSENCE_LOG_DIR/crate-tests.log"

      - name: 测试 v2 补全路径边界
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'cargo nextest run --locked --no-fail-fast --no-tests fail --retries 0 -p warp_completer --lib --features v2 -E test(completer::engine::path::tests::)'
            cargo nextest run --locked --no-fail-fast --no-tests fail --retries 0 -p warp_completer --lib --features v2 -E 'test(completer::engine::path::tests::)'
          } 2>&1 | tee "$UPSTREAM_ESSENCE_LOG_DIR/completer-tests.log"

      - name: 测试本轮应用回归与双语资源
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "cargo nextest run --locked --no-fail-fast --no-tests fail --retries 0 -p warp --lib --features $APP_FEATURES -E '$APP_FILTER'"
            cargo nextest run --locked --no-fail-fast --no-tests fail --retries 0 -p warp --lib --features "$APP_FEATURES" -E "$APP_FILTER"
          } 2>&1 | tee "$UPSTREAM_ESSENCE_LOG_DIR/app-tests.log"

      - name: 保存上游精华验证日志
        if: ${{ always() && steps.toolchain.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-essence-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/upstream-essence/*.log
            ${{ runner.temp }}/upstream-essence/*.json
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    needs: validate_scope
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_linux &&
       (inputs.windows_atomic_debug_scope != 'upstream_essence' || inputs.full_workspace_tests))
    runs-on: [self-hosted, linux, x64, infinishell-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Validate Linux native bridge verification scope
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_grok_native_bridge_source || inputs.run_grok_native_bridge_host) && inputs.linux_gui_only && !inputs.full_workspace_tests }}
        shell: bash
        run: |
          echo '::error::普通桥门禁不能与仅 GUI 模式同时启用'
          exit 1

      # 固定完整 action 提交和 Python 补丁版本，只更新当前作业的工具链环境。
      - name: Install Python for CLI parity verification
        id: native_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 10
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
          update-environment: true

      # 环境事实独立采集；不挂载、不创建用户、不执行安装升级。
      - name: Probe Linux package source environment without mutations
        id: package_source_environment
