      - name: Verify native Codex plugin registry failure recovery
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_codex.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_codex_plugin_lifecycle.py --codex-version 0.156.1 --codex-executable "$env:INFINISHELL_TEST_CODEX_EXE" --output "$env:RUNNER_TEMP\codex-plugin-lifecycle.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex plugin registry failure recovery failed' }

      - name: Verify native Codex persistent plugin source
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_codex.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 10
        env:
