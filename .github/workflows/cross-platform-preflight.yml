          $jqExecutable = (Get-Command jq.exe -ErrorAction Stop).Source
          python -B "$env:GITHUB_WORKSPACE\script\cli-agent-parity\probe_codex_windows_conpty.py" --codex-version 0.156.1 --repo "$env:GITHUB_WORKSPACE" --download-dir "$env:RUNNER_TEMP\codex-01561-hook-inputs" --bash-executable "$gitBash" --jq-executable "$jqExecutable" --output "$env:RUNNER_TEMP\codex-01561-windows-conpty.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex ConPTY transport failed; product notifications remain unverified' }

      - name: Preserve fixed Codex 0.156.1 Windows ConPTY evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled()) }}
