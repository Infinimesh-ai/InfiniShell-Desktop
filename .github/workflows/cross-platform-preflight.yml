name: Cross-platform preflight

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:
    inputs:
      run_linux:
        description: Run the Linux self-hosted job
        required: true
        default: true
        type: boolean
      run_windows:
        description: Run the Windows self-hosted job
        required: true
        default: true
        type: boolean
      run_macos_intel:
        description: 备用：交叉构建并原生验证 macOS x86_64 SSH 扩展
        required: true
        default: false
        type: boolean
      full_workspace_tests:
        description: Compile GUI integration tests and run the desktop workspace unit suite
        required: true
        default: false
        type: boolean
      run_atomic_windows_debug:
        description: Diagnose bounded native Windows image-debug exit and rejection
        required: true
        default: false
        type: boolean
# 自托管 runner 只需要读取代码。这个 workflow 不接收部署密钥，也不向仓库写入内容。
permissions:
  contents: read

concurrency:
  group: cross-platform-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux x64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_linux)
    runs-on: [self-hosted, linux, x64, infinishell-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 固定完整 action 提交和 Python 补丁版本，只更新当前作业的工具链环境。
      - name: Install Python for CLI parity verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 10
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
          update-environment: true

      - name: Verify provisioned toolchain
        shell: bash
        run: |
          set -euo pipefail
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version

      # 复用 prepare_environment 中固定的 Node 引导，实际运行测试而非依赖 runner 的旧版本。
      - name: Install Node for CLI plugin verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0

      - name: Test Grok notification plugin scripts
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 18) throw new Error('Node 18+ is required');"
          node --test script/cli-agent-parity/grok_plugin_tests.cjs

      - name: Test notification patch file transactions
        shell: bash
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          command -v python3
          python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11+ is required'; print(sys.version)"
          python3 script/cli-agent-parity/notification_patch_tests.py -v
          python3 -B script/cli-agent-parity/codex_persistent_source_tests.py -v
          python3 script/cli-agent-parity/codex_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_profile_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_coordinator_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_batch_cancel_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_approval_cancel_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_image_probe_runner_tests.py -v
          python3 -B script/cli-agent-parity/claude_managed_image_runner_tests.py -v
          python3 -B script/cli-agent-parity/codex_source_runner_tests.py -v
          python3 -B script/cli-agent-parity/codex_journal_recovery_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_coordinator_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_official_pty_runner_tests.py -v
          # 官方隔离运行器的 POSIX 权限与私有文件回归，不发起模型请求。
          python3 -B script/cli-agent-parity/grok_official_adapter_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_sdk_origin_probe_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_native_tool_lease_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_policy_preflight_runner_tests.py -v
          # 仅运行合成证据与准备边界回归，不启动真实 CLI 或模型。
          python3 -B script/cli-agent-parity/grok_native_skill_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_fixed_policy_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_child_coordinator_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_files_policy_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_selected_skill_runner_tests.py -v
          python3 -B script/cli-agent-parity/grok_catalog_preflight_runner_tests.py -v
          python3 -B script/cli-agent-parity/codex_windows_hook_tests.py -v
          python3 -B script/cli-agent-parity/codex_plugin_lifecycle_tests.py -v
          python3 -B script/cli-agent-parity/codex_windows_notify_tests.py -v
          python3 -B script/cli-agent-parity/codex_plugin_cache_refresh_tests.py -v
          python3 -B script/cli-agent-parity/prepare_codex_cli_tests.py -v
          python3 -B script/cli-agent-parity/verify_cli_autoupdate_tests.py -v
          # 原始 Grok P0 的 POSIX 离线夹具；不启动真实 CLI 或模型。
          python3 -B script/cli-agent-parity/grok_native_p0_probe_tests.py -v
          python3 -B script/cli-agent-parity/prepare_claude_cli_tests.py -v
          python3 -B script/cli-agent-parity/claude_windows_notifications_tests.py -v
          python3 -B script/cli-agent-parity/prepare_grok_cli_tests.py -v
          python3 -B script/cli-agent-parity/grok_fixed_acp_probe_tests.py -v
          python3 -B script/cli-agent-parity/probe_claude_no_credentials_tests.py -v
          python3 -B script/cli-agent-parity/probe_claude_permission_snapshot_tests.py -v

      - name: Prepare fixed native Codex without credentials
        shell: bash
        run: |
          set -euo pipefail
          codex_executable="$(python3 -B script/cli-agent-parity/prepare_codex_cli.py --version 0.155.1 --download-dir "$RUNNER_TEMP/codex-01551-inputs")"
          printf 'INFINISHELL_TEST_CODEX_EXE=%s\n' "$codex_executable" >> "$GITHUB_ENV"

      - name: Prepare fixed native Claude without credentials
        id: fixed_claude
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          claude_executable="$(python3 -B script/cli-agent-parity/prepare_claude_cli.py --claude-version 2.1.278 --download-dir "$RUNNER_TEMP/claude-21278-inputs")"
          printf 'INFINISHELL_TEST_CLAUDE_EXE=%s\n' "$claude_executable" >> "$GITHUB_ENV"

      - name: Prepare fixed native Grok without credentials
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          grok_executable="$(python3 -B script/cli-agent-parity/prepare_grok_cli.py --download-dir "$RUNNER_TEMP/grok-cli-fixed")"
          printf 'INFINISHELL_TEST_GROK_EXE=%s\n' "$grok_executable" >> "$GITHUB_ENV"

      - name: Verify fixed Grok unauthenticated ACP boundaries
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/grok_fixed_acp_probe.py --executable "$INFINISHELL_TEST_GROK_EXE" --output "$RUNNER_TEMP/grok-fixed-acp.json"

      - name: Verify native Claude initialization and idle EOF
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_claude_no_credentials.py --claude-version 2.1.278 --executable "$INFINISHELL_TEST_CLAUDE_EXE" --output "$RUNNER_TEMP/claude-initialize-idle-eof.json"

      - name: Verify native Claude permission observations without credentials
        if: ${{ !cancelled() && steps.fixed_claude.outcome == 'success' }}
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_claude_permission_snapshot.py --claude-version 2.1.278 --executable "$INFINISHELL_TEST_CLAUDE_EXE" --output "$RUNNER_TEMP/claude-permission-observation.json"

      - name: Verify native Codex plugin registry failure recovery
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_codex_plugin_lifecycle.py --codex-version 0.155.1 --codex-executable "$INFINISHELL_TEST_CODEX_EXE" --output "$RUNNER_TEMP/codex-plugin-lifecycle.json"

      - name: Verify native Codex persistent plugin source
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -B script/cli-agent-parity/probe_codex_plugin_cache_refresh.py --codex-version 0.155.1 --codex-executable "$INFINISHELL_TEST_CODEX_EXE" --output "$RUNNER_TEMP/codex-plugin-cache-refresh.json"

      - name: Test Claude and Codex Bash notification payloads
        shell: bash
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          command -v bash
          command -v jq
          bash --version
          jq --version
          python3 script/cli-agent-parity/plugin_compatibility_tests.py -v

      - name: Test Unix PTY notification framing
        shell: bash
        run: python3 script/cli-agent-parity/tmux_notification_tests.py

      - name: Check InfiniShell-Desktop
        shell: bash
        run: cargo check -p warp --lib

      # Windows named-pipe stream 与创建它的 Tokio reactor 绑定；Linux 同步执行同一合同。
      - name: Test IPC frame-limit recovery
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p ipc --lib
          -E 'test(server_accepts_a_new_client_after_rejecting_an_oversized_frame) | test(client_disconnects_after_an_oversized_response_header)'

      - name: Test agent lifecycle, terminal cancellation, and Responses integration
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p warp --lib
          -E 'test(responses) | test(ai::agent_providers::) | test(ai::api_error::tests) | test(ai::byop_compaction::) | test(ai::blocklist::controller) | test(ai::agent::tests::format_for_copy) | test(terminal::view::tests::stop_task_) | test(terminal::view::tests::failed_conversation_interrupts_command_without_overwriting_error) | test(ai::blocklist::action_model::tests::) | test(ai::blocklist::action_model::preprocess::tests::) | test(ai::blocklist::action_model::execute::) | test(terminal::view::tests::stopped_command_) | test(completed_user_controlled_lrc_) | test(inline_agent_view_persists_across_transfer_takeover_for_monitored_long_running_command) | test(terminal::local_tty::event_loop::tests::) | test(terminal::local_tty::windows::event_loop_tests::) | test(synchronized_output) | test(ai::agent::conversation::) | test(ai::agent::task::) | test(ai::skills::) | test(ai::blocklist::history_model) | test(persistence::sqlite::checkpoint_tests) | test(i18n::tests) | test(cli_agent) | test(specific_cli_launch) | test(cli_draft) | test(terminal::model::session::test::) | test(terminal::model::ansi::dcs_hooks::tests::) | test(ai::agent_sdk::driver::harness::) | test(terminal::view::use_agent_footer::tests) | test(editor::view::image_input::tests) | test(local_cli_review_import) | test(local_harness) | test(harness_availability) | test(local_cli_tasks) | test(local_cli_mailbox) | test(terminal::input::skills::) | test(terminal::input::slash_commands::data_source::) | test(ai::orchestration::)'

      # 共享 CLI 状态转换和 TUI 消息渲染属于独立 crate，不能被 -p warp 的筛选覆盖。
      - name: Test shared CLI action contracts and skills
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p ai --lib
          -E 'test(agent::action_result::) | test(agent::action::) | test(skills::)'

      - name: Test CLI harness arguments
        shell: bash
        run: cargo nextest run --no-fail-fast -p warp_cli --lib

      - name: Test bilingual TUI task message states
        shell: bash
        run: cargo nextest run --no-fail-fast -p warp_tui --lib -E 'test(tool_call_labels::tests::)'

      - name: Test managed command process ownership
        shell: bash
        run: cargo nextest run --no-fail-fast -p command --lib -E 'test(managed::tests::)'

      # 使用同一提交构建的真实 worker；内部夹具和模型网络验收不混入此筛选。
      - name: Build CLI process supervisor
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build -p warp_tui --bin infinishell-tui

      - name: Test installed Grok hook through the native notification worker
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          # Cargo 可以把顶层二进制硬链接到 deps 产物；正式安装身份门禁要求单链接文件。
          # 复制同提交构建产物到 runner 私有目录，不放宽生产 worker 的身份校验。
          install -m 0755 "$target_dir/debug/infinishell-tui" "$RUNNER_TEMP/infinishell-test-notify-worker"
          export INFINISHELL_TEST_NOTIFY_WORKER="$RUNNER_TEMP/infinishell-test-notify-worker"
          python3 -B script/cli-agent-parity/installed_grok_hook_tests.py -v

      - name: Test supervisor cleanup after host crash
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          export INFINISHELL_CLI_SUPERVISOR_EXECUTABLE="$target_dir/debug/infinishell-tui"
          cargo nextest run --no-fail-fast -p warp --lib --run-ignored only -E 'test(managed_process::live_tests::supervised_)'

      - name: Verify native recovery and idle-crash boundaries without credentials
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          test_binary="$(cargo test -p warp --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; paths=[item["executable"] for item in items if item.get("reason")=="compiler-artifact" and item.get("target",{}).get("name")=="warp" and item.get("profile",{}).get("test") and item.get("executable")]; assert len(paths)==1, paths; print(paths[0])')"
          python3 -B script/cli-agent-parity/run_codex_adapter_live.py --test-case missing-session --test-binary "$test_binary" --codex "$INFINISHELL_TEST_CODEX_EXE" --supervisor "$target_dir/debug/infinishell-tui" --output "$RUNNER_TEMP/codex-missing-session.ndjson"
          python3 -B script/cli-agent-parity/run_codex_adapter_live.py --test-case idle-crash --test-binary "$test_binary" --codex "$INFINISHELL_TEST_CODEX_EXE" --supervisor "$target_dir/debug/infinishell-tui" --output "$RUNNER_TEMP/codex-idle-crash.ndjson"

      - name: Preserve Linux native CLI boundary evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux-native-boundaries-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-plugin-lifecycle.json
            ${{ runner.temp }}/codex-plugin-cache-refresh.json
            ${{ runner.temp }}/codex-missing-session.*
            ${{ runner.temp }}/codex-idle-crash.*
            ${{ runner.temp }}/claude-initialize-idle-eof.json
            ${{ runner.temp }}/claude-permission-observation.json
            ${{ runner.temp }}/claude-21278-inputs/claude-fixed-inputs.json
            ${{ runner.temp }}/grok-cli-fixed/grok-fixed-inputs.json
            ${{ runner.temp }}/grok-fixed-acp.json
          if-no-files-found: error
          retention-days: 14

      - name: Test rust-genai
        shell: bash
        run: cargo test --manifest-path lib/rust-genai/Cargo.toml --lib

      - name: Compile GUI integration tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: bash
        run: cargo nextest run --no-run -p integration

      - name: Run desktop workspace unit tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: bash
        # 全量桌面测试不包含 TUI；本次变动的 TUI 消息状态已由上方定向步骤覆盖。
        # integration 需要专用图形会话，此处完成跨平台编译后交由 GUI 测试流程执行。
        run: cargo nextest run --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude warp_tui

  macos_intel_ssh_extension_build:
    name: macOS Intel SSH extension fallback cross-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_intel }}
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      release_tag: ${{ steps.metadata.outputs.tag }}
    env:
      CHANNEL: oss
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: preflight-macos-x86_64-ssh-extension
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure Intel rust target is installed
        shell: bash
        run: rustup target add x86_64-apple-darwin

      - name: Compute temporary extension version
        id: metadata
        shell: bash
        run: |
          tag="v0.$(date -u +%Y.%m.%d.%H.%M).oss_01"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cross-build Intel SSH extension
        id: bundle_cli
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          df -h .
          sysctl -n hw.memsize
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --nosign

      - name: Verify Intel SSH extension tarball
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ steps.bundle_cli.outputs.binary_path }}"
          resources="${{ steps.bundle_cli.outputs.bundled_resources_dir }}"
          file "$binary"
          [[ "$(lipo -archs "$binary")" == "x86_64" ]]
          cp "$binary" infinishell
          tar czf infinishell-macos-x86_64.tar.gz infinishell \
            -C "$(dirname "$resources")" resources
          shasum -a 256 infinishell-macos-x86_64.tar.gz
          df -h .

      - name: Upload Intel SSH extension preflight tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infinishell-macos-x86_64-ssh-extension-preflight
          path: infinishell-macos-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 3

  macos_intel_ssh_extension_native:
    name: macOS Intel SSH extension native acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_intel }}
    needs: macos_intel_ssh_extension_build
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Download Intel SSH extension preflight tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infinishell-macos-x86_64-ssh-extension-preflight
          path: artifact

      - name: Run Intel SSH extension natively
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.macos_intel_ssh_extension_build.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infinishell-intel-ssh-extension"
          tar xzf artifact/infinishell-macos-x86_64.tar.gz \
            -C "$RUNNER_TEMP/infinishell-intel-ssh-extension"
          cd "$RUNNER_TEMP/infinishell-intel-ssh-extension"
          [[ "$(lipo -archs infinishell)" == "x86_64" ]]
          version=$(./infinishell --version)
          echo "$version"
          [[ "$version" == *"$EXPECTED_TAG"* ]]
          test -d resources

  windows:
    name: Windows x64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_windows)
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: 'C:\infinishell-ci\cargo-target'
      RUSTC_WRAPPER: 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
      SCCACHE_DIR: 'C:\infinishell-ci\sccache'
      SCCACHE_CACHE_SIZE: 80G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 自托管 runner 的目标目录与 sccache 可以完整重建。每次验收先清除旧产物，
      # 避免历史提交累积占满系统盘并让后续平台门禁在编译中途失败。
      - name: Reclaim Windows build storage
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:RUSTC_WRAPPER --stop-server
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'No running sccache server needed to be stopped'
          }

          $buildRoots = @(
            'C:\infinishell-ci\cargo-target',
            'C:\infinishell-ci\sccache'
          )
          foreach ($buildRoot in $buildRoots) {
            $resolved = [System.IO.Path]::GetFullPath($buildRoot)
            if ($resolved -ne $buildRoot) {
              throw "Unexpected build cleanup path: $resolved"
            }
            if (Test-Path -LiteralPath $resolved) {
              Remove-Item -LiteralPath $resolved -Recurse -Force
            }
            New-Item -ItemType Directory -Path $resolved | Out-Null
          }
          Get-PSDrive -Name C | Select-Object Name, Used, Free
          exit 0

      # 直接解压固定摘要的官方 CI 包，保持当前作业以外的 Python 安装配置。
      - name: Prepare job-local Python for CLI parity verification
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/prepare_windows_python.ps1

      - name: Configure Windows build environment
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $strawberryPerl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $strawberryPerl) {
            'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "OPENSSL_SRC_PERL=$strawberryPerl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $libclang = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $libclang 'libclang.dll')) {
            $libclang | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Verify provisioned toolchain
        id: windows_toolchain
        shell: pwsh
        run: |
          $commands = @('git', 'bash', 'rustc', 'cargo', 'cmake', 'protoc', 'perl')
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required command is missing: $command"
            }
          }
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version
          & $env:RUSTC_WRAPPER --version
          & $env:RUSTC_WRAPPER --zero-stats

      # 与仓库共用构建引导使用同一固定 Node 版本；缺依赖必须失败，不能跳过校验。
      - name: Install Node for CLI plugin verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0

      - name: Test Grok notification plugin scripts
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node version probe failed' }
          node -e "if (Number(process.versions.node.split('.')[0]) < 18) throw new Error('Node 18+ is required');"
          if ($LASTEXITCODE -ne 0) { throw 'Node test runtime is unavailable' }
          node --test script/cli-agent-parity/grok_plugin_tests.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Grok notification script tests failed' }

      - name: Test notification patch file transactions
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw 'Native Python 3.11+ is required; notification file transactions were not verified'
          }
          python -c "import os, sys; assert os.name == 'nt', 'Native Windows Python is required'; assert sys.version_info >= (3, 11), 'Python 3.11+ is required'; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Native Python version probe failed' }
          python script/cli-agent-parity/notification_patch_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows notification file transaction tests failed' }
          python -B script/cli-agent-parity/codex_persistent_source_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Persistent Codex source transaction tests failed' }
          python script/cli-agent-parity/codex_adapter_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'CLI acceptance evidence validation failed' }
          python -B script/cli-agent-parity/claude_adapter_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude acceptance evidence validation failed' }
          python -B script/cli-agent-parity/claude_profile_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude fixed-profile evidence validation failed' }
          python -B script/cli-agent-parity/claude_coordinator_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude coordinator evidence validation failed' }
          python -B script/cli-agent-parity/claude_batch_cancel_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude 批次取消证据校验失败' }
          python -B script/cli-agent-parity/claude_approval_cancel_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude 等待审批取消证据校验失败' }
          python -B script/cli-agent-parity/claude_image_probe_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude image evidence validation failed' }
          python -B script/cli-agent-parity/claude_managed_image_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude 托管 PNG 验收证据校验失败' }
          python -B script/cli-agent-parity/codex_source_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Codex source migration evidence validation failed' }
          python -B script/cli-agent-parity/codex_journal_recovery_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Codex journal recovery evidence validation failed' }
          python -B script/cli-agent-parity/grok_adapter_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok adapter evidence validation failed' }
          python -B script/cli-agent-parity/grok_coordinator_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok coordinator evidence validation failed' }
          python -B script/cli-agent-parity/grok_official_pty_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok ordinary PTY preparation validation failed' }
          python -B script/cli-agent-parity/grok_policy_preflight_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok 只读权限接口预检证据校验失败' }
          # 仅运行合成证据与准备边界回归，不启动真实 CLI 或模型。
          python -B script/cli-agent-parity/grok_native_skill_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok 原生技能离线证据校验失败' }
          python -B script/cli-agent-parity/grok_fixed_policy_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok 固定策略离线证据校验失败' }
          python -B script/cli-agent-parity/grok_child_coordinator_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok 父子任务离线证据校验失败' }
          python -B script/cli-agent-parity/grok_files_policy_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok 文件工具离线证据校验失败' }
          python -B script/cli-agent-parity/grok_selected_skill_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok 所选技能离线证据校验失败' }
          python -B script/cli-agent-parity/grok_catalog_preflight_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok SDK 目录离线证据校验失败' }
          # macOS 官方隔离运行器依赖 POSIX 文件权限；Windows 原生门禁由 Rust 与下方步骤验证。
          python -B script/cli-agent-parity/codex_windows_hook_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows hook command and fixed-input validation failed' }
          python -B script/cli-agent-parity/codex_plugin_lifecycle_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native plugin lifecycle evidence validation failed' }
          python -B script/cli-agent-parity/codex_windows_notify_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows notification transport candidate validation failed' }
          python -B script/cli-agent-parity/codex_plugin_cache_refresh_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native persistent source cleanup validation failed' }
          python -B script/cli-agent-parity/prepare_codex_cli_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Codex package preparation validation failed' }
          python -B script/cli-agent-parity/verify_cli_autoupdate_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed CLI autoupdate validation failed' }
          python -B script/cli-agent-parity/prepare_claude_cli_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Claude preparation validation failed' }
          python -B script/cli-agent-parity/claude_windows_notifications_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude Windows 通知离线判定失败' }
          python -B script/cli-agent-parity/prepare_grok_cli_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok preparation validation failed' }
          python -B script/cli-agent-parity/grok_fixed_acp_probe_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok ACP evidence validation failed' }
          python -B script/cli-agent-parity/probe_claude_no_credentials_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude initialize and idle EOF evidence validation failed' }
          python -B script/cli-agent-parity/probe_claude_permission_snapshot_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Claude permission observation validation failed' }

      - name: Prepare fixed native Codex without credentials
        id: fixed_codex
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $codexExecutable = python -B script/cli-agent-parity/prepare_codex_cli.py --version 0.155.1 --download-dir "$env:RUNNER_TEMP\codex-01551-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native Codex preparation failed' }
          "INFINISHELL_TEST_CODEX_EXE=$codexExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 生产通知安装器的当前插件合同仍精确绑定 0.147.0；不要把最新版运行时冒充该合同。
      - name: Prepare fixed Codex production installer contract
        id: fixed_codex_installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $codexInstallerExecutable = python -B script/cli-agent-parity/prepare_codex_cli.py --version 0.147.0 --download-dir "$env:RUNNER_TEMP\codex-0147-installer-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Codex production installer contract preparation failed' }
          "INFINISHELL_TEST_CODEX_INSTALLER_EXE=$codexInstallerExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare fixed native Claude without credentials
        id: fixed_claude
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $claudeExecutable = python -B script/cli-agent-parity/prepare_claude_cli.py --claude-version 2.1.278 --download-dir "$env:RUNNER_TEMP\claude-21278-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native Claude preparation failed' }
          "INFINISHELL_TEST_CLAUDE_EXE=$claudeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare fixed native Grok without credentials
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $grokExecutable = python -B script/cli-agent-parity/prepare_grok_cli.py --download-dir (Join-Path $env:RUNNER_TEMP 'grok-cli-fixed')
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native Grok preparation failed' }
          "INFINISHELL_TEST_GROK_EXE=$grokExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify fixed Grok unauthenticated ACP boundaries
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/grok_fixed_acp_probe.py --executable "$env:INFINISHELL_TEST_GROK_EXE" --output (Join-Path $env:RUNNER_TEMP 'grok-fixed-acp.json')
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok unauthenticated ACP boundaries failed' }

      - name: Verify native Claude initialization and idle EOF
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_claude_no_credentials.py --claude-version 2.1.278 --executable "$env:INFINISHELL_TEST_CLAUDE_EXE" --output "$env:RUNNER_TEMP\claude-initialize-idle-eof.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Claude initialize and idle EOF validation failed' }

      - name: Verify native Claude permission observations without credentials
        if: ${{ !cancelled() && steps.fixed_claude.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_claude_permission_snapshot.py --claude-version 2.1.278 --executable "$env:INFINISHELL_TEST_CLAUDE_EXE" --output "$env:RUNNER_TEMP\claude-permission-observation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Claude permission observation validation failed' }

      - name: Verify native Codex plugin registry failure recovery
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_codex_plugin_lifecycle.py --codex-version 0.155.1 --codex-executable "$env:INFINISHELL_TEST_CODEX_EXE" --output "$env:RUNNER_TEMP\codex-plugin-lifecycle.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex plugin registry failure recovery failed' }

      - name: Verify native Codex persistent plugin source
        shell: pwsh
        timeout-minutes: 10
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_codex_plugin_cache_refresh.py --codex-version 0.155.1 --codex-executable "$env:INFINISHELL_TEST_CODEX_EXE" --output "$env:RUNNER_TEMP\codex-plugin-cache-refresh.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex persistent plugin source validation failed' }

      # 单独验证 Git Bash/jq，不将原生文件事务通过冒充 Windows hooks 已通过。
      # 即使前面的独立门禁失败，也保留这项验证的真实结果。
      - name: Test Windows Git Bash notification payloads
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -PathType Leaf $_ } | Select-Object -First 1
          if (-not $gitBash) {
            throw 'Windows payloads were not verified: Git for Windows bash.exe is missing'
          }
          $env:PATH = "$(Split-Path -Parent $gitBash);$env:PATH"
          $resolvedBash = (Get-Command bash.exe -ErrorAction Stop).Source
          if ($resolvedBash -ne $gitBash) { throw 'The Bash resolved by payload tests does not match Git for Windows' }
          Write-Output "Verified Git Bash path: $gitBash"
          & $gitBash --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash version probe failed' }
          & $gitBash --noprofile --norc -c 'case "$(uname -s)" in MINGW*|MSYS*) ;; *) exit 1 ;; esac; command -v jq >/dev/null && jq --version'
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows payloads were not verified: native Git Bash or jq is unavailable'
          }
          python -c "import os, sys; assert os.name == 'nt' and sys.version_info >= (3, 11), 'Native Windows Python 3.11+ is required'"
          if ($LASTEXITCODE -ne 0) { throw 'Windows payload Python preflight failed' }
          python script/cli-agent-parity/plugin_compatibility_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows Git Bash notification payload tests failed; hooks remain unverified' }

      # 原生候选只在临时目录加载，必须在模型调用前由真实 hook 阻断，不开启产品安装门禁。
      - name: Verify Codex Windows native hooks without model requests
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 20
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\usr\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -PathType Leaf $_ } | Select-Object -First 1
          if (-not $gitBash) { throw 'Native Git Bash with msys-2.0.dll is required for Codex hooks' }
          $env:INFINISHELL_GIT_BASH_EXE = (Resolve-Path $gitBash).Path
          $env:INFINISHELL_JQ_EXE = (Get-Command jq.exe -ErrorAction Stop).Source
          python -B "$env:GITHUB_WORKSPACE\script\cli-agent-parity\probe_codex_windows_hooks.py" --repo "$env:GITHUB_WORKSPACE" --architecture x86_64 --download-dir "$env:RUNNER_TEMP\codex-0147-hook-inputs" --bash-executable "$env:INFINISHELL_GIT_BASH_EXE" --jq-executable "$env:INFINISHELL_JQ_EXE" --output "$env:RUNNER_TEMP\codex-windows-native-hooks.json"
          if ($LASTEXITCODE -ne 0) { throw 'Codex native Windows hook verification failed; compatibility remains unverified' }

      - name: Preserve Codex Windows native hook evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-windows-native-hooks-${{ github.sha }}
          path: ${{ runner.temp }}/codex-windows-native-hooks.json
          if-no-files-found: error
          retention-days: 14

      # 单独读取真实 ConPTY 字节；hook 完成或独立 CONOUT$ 标记均不能代替通知到达。
      - name: Verify Codex Windows ConPTY notification transport
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 10
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          python -B "$env:GITHUB_WORKSPACE\script\cli-agent-parity\codex_windows_conpty_tests.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'ConPTY probe contract tests failed' }
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\usr\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -PathType Leaf $_ } | Select-Object -First 1
          if (-not $gitBash) { throw 'Native Git Bash with msys-2.0.dll is required for ConPTY verification' }
          $jqExecutable = (Get-Command jq.exe -ErrorAction Stop).Source
          python -B "$env:GITHUB_WORKSPACE\script\cli-agent-parity\probe_codex_windows_conpty.py" --repo "$env:GITHUB_WORKSPACE" --download-dir "$env:RUNNER_TEMP\codex-0147-hook-inputs" --bash-executable "$gitBash" --jq-executable "$jqExecutable" --output "$env:RUNNER_TEMP\codex-windows-conpty.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex ConPTY transport failed; product notifications remain unverified' }

      - name: Preserve Codex Windows ConPTY evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-windows-conpty-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-windows-conpty.json
            ${{ runner.temp }}/codex-windows-conpty.native.json
            ${{ runner.temp }}/codex-windows-conpty.pty.bin
          if-no-files-found: error
          retention-days: 14

      # 原生插件探针和离线 Rust 门禁互相独立；保留失败，同时继续具备前置条件的检查。
      # 通过显式步骤依赖阻止缺少工具链、测试二进制或监督 worker 时误跑后续验收。
      # 只验证私有、已完成引导但未登录的会话；路径初始化不能代替正式 OSC 传输。
      # 独立条件不因其他 CLI 门禁失败而跳过；没有自动重试，也不开放产品安装门控。
      - name: Verify Claude Windows native SessionStart notification without credentials
        id: claude_windows_notifications
        if: ${{ !cancelled() && steps.fixed_claude.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 8
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_claude_windows_notifications.py --claude-version 2.1.278 --executable "$env:INFINISHELL_TEST_CLAUDE_EXE" --output (Join-Path $env:RUNNER_TEMP 'claude-windows-notifications.json')
          if ($LASTEXITCODE -ne 0) { throw 'Claude Windows 原生 SessionStart 通知未通过，保留门控关闭' }

      - name: Preserve Claude Windows native notification evidence
        if: ${{ !cancelled() && steps.claude_windows_notifications.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-windows-notifications-${{ github.sha }}
          path: ${{ runner.temp }}/claude-windows-notifications.json
          if-no-files-found: error
          retention-days: 14

      - name: Check InfiniShell-Desktop
        id: check_app
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        shell: pwsh
        run: cargo check -p warp --lib

      # Windows named-pipe stream 与创建它的 Tokio reactor 绑定；直接覆盖超大帧后的恢复路径。
      - name: Test IPC frame-limit recovery
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: >-
          cargo nextest run --no-fail-fast -p ipc --lib
          -E 'test(server_accepts_a_new_client_after_rejecting_an_oversized_frame) | test(client_disconnects_after_an_oversized_response_header)'

      - name: Build InfiniShell SSH worker
        id: ssh_worker
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: cargo build -p warp --bin infinishell-ssh --features "release_bundle,gui,autoupdate,nld_classifier_v3,nld_heuristic_v2,rust_ssh_worker"

      - name: Test Windows PowerShell SSH worker arguments
        if: ${{ !cancelled() && steps.ssh_worker.outcome == 'success' }}
        shell: powershell
        run: >-
          .\script\windows\test_pwsh_ssh_worker.ps1
          -WorkerPath "$env:CARGO_TARGET_DIR\debug\infinishell-ssh.exe"

      - name: Test agent lifecycle, terminal cancellation, and Responses integration
        id: test_app
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: >-
          cargo nextest run --no-fail-fast -p warp --lib
          -E 'test(responses) | test(ai::agent_providers::) | test(ai::api_error::tests) | test(ai::byop_compaction::) | test(ai::blocklist::controller) | test(ai::agent::tests::format_for_copy) | test(terminal::view::tests::stop_task_) | test(terminal::view::tests::failed_conversation_interrupts_command_without_overwriting_error) | test(ai::blocklist::action_model::tests::) | test(ai::blocklist::action_model::preprocess::tests::) | test(ai::blocklist::action_model::execute::) | test(terminal::view::tests::stopped_command_) | test(completed_user_controlled_lrc_) | test(inline_agent_view_persists_across_transfer_takeover_for_monitored_long_running_command) | test(terminal::local_tty::event_loop::tests::) | test(terminal::local_tty::windows::event_loop_tests::) | test(synchronized_output) | test(ai::agent::conversation::) | test(ai::agent::task::) | test(ai::skills::) | test(ai::blocklist::history_model) | test(persistence::sqlite::checkpoint_tests) | test(i18n::tests) | test(cli_agent) | test(specific_cli_launch) | test(cli_draft) | test(terminal::model::session::test::) | test(terminal::model::ansi::dcs_hooks::tests::) | test(ai::agent_sdk::driver::harness::) | test(terminal::view::use_agent_footer::tests) | test(editor::view::image_input::tests) | test(local_cli_review_import) | test(local_harness) | test(harness_availability) | test(local_cli_tasks) | test(local_cli_mailbox) | test(terminal::input::skills::) | test(terminal::input::slash_commands::data_source::) | test(ai::orchestration::)'

      # 与较早的原生注册/缓存探针分开，实际走同提交的 Rust 通知安装入口。
      - name: Verify Windows Codex production notification installer without credentials
        id: codex_source_installer
        if: ${{ !cancelled() && steps.fixed_codex_installer.outcome == 'success' && steps.check_app.outcome == 'success' && steps.test_app.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 8
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $buildMessages = cargo test -p warp --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit warp libtest discovery failed' }
          $executables = @($buildMessages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'warp' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected exactly one same-commit warp libtest executable' }
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\usr\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and (Test-Path -LiteralPath (Join-Path (Split-Path $_) 'msys-2.0.dll') -PathType Leaf) } | Select-Object -First 1
          if (-not $gitBash) { throw 'Native Git Bash usr/bin is required for the production notification installer' }
          $jqExecutable = (Get-Command jq.exe -CommandType Application -ErrorAction Stop).Source
          $systemDirectory = Join-Path $env:SYSTEMROOT 'System32'
          $powershellDirectory = Join-Path $systemDirectory 'WindowsPowerShell\v1.0'
          $env:PATH = "$(Split-Path $gitBash);$(Split-Path $jqExecutable);$powershellDirectory;$systemDirectory;$env:PATH"
          python -B script/cli-agent-parity/run_codex_source_live.py --test-binary $executables[0] --codex "$env:INFINISHELL_TEST_CODEX_INSTALLER_EXE" --output "$env:RUNNER_TEMP\codex-rust-source-installer.ndjson" --timeout 300
          if ($LASTEXITCODE -ne 0) { throw 'Production Codex installer migration or idempotent verification failed; no automatic retry' }

      - name: Preserve Windows Codex production installer evidence
        if: ${{ !cancelled() && steps.codex_source_installer.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-windows-production-installer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-rust-source-installer.ndjson
            ${{ runner.temp }}/codex-rust-source-installer.metadata.json
            ${{ runner.temp }}/codex-rust-source-installer.test-output.txt
          if-no-files-found: error
          retention-days: 14

      # 共享 CLI 状态转换和 TUI 消息渲染属于独立 crate，不能被 -p warp 的筛选覆盖。
      - name: Test shared CLI action contracts and skills
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: >-
          cargo nextest run --no-fail-fast -p ai --lib
          -E 'test(agent::action_result::) | test(agent::action::) | test(skills::)'

      - name: Test CLI harness arguments
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: cargo nextest run --no-fail-fast -p warp_cli --lib

      - name: Test bilingual TUI task message states
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: cargo nextest run --no-fail-fast -p warp_tui --lib -E 'test(tool_call_labels::tests::)'

      - name: Test managed command process ownership
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        run: cargo nextest run --no-fail-fast -p command --lib -E 'test(managed::tests::)'

      - name: Diagnose Windows atomic image-debug exit in a strict Job
        if: ${{ !cancelled() && inputs.run_atomic_windows_debug && steps.test_app.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          cargo nextest run --no-fail-fast -p warp --lib --run-ignored only -E 'test(managed_process::atomic_windows::tests::debug_session_runs_system_only_process_to_native_exit) | test(managed_process::atomic_windows::tests::debug_session_rejects_non_system_dynamic_image_before_continue)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 使用同一提交构建的真实 worker；内部夹具和模型网络验收不混入此筛选。
      - name: Build CLI process supervisor
        id: supervisor
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' }}
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build -p warp_tui --bin infinishell-tui

      - name: Test supervisor cleanup after host crash
        if: ${{ !cancelled() && steps.supervisor.outcome == 'success' && steps.test_app.outcome == 'success' }}
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:INFINISHELL_CLI_SUPERVISOR_EXECUTABLE = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          cargo nextest run --no-fail-fast -p warp --lib --run-ignored only -E 'test(managed_process::live_tests::supervised_)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native recovery and idle-crash boundaries without credentials
        if: ${{ !cancelled() && steps.fixed_codex.outcome == 'success' && steps.supervisor.outcome == 'success' && steps.test_app.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 15
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $buildMessages = cargo test -p warp --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Same-commit warp test build failed' }
          $executables = @($buildMessages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'warp' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected exactly one warp libtest executable' }
          $worker = Join-Path $metadata.target_directory 'debug/infinishell-tui.exe'
          python -B script/cli-agent-parity/run_codex_adapter_live.py --test-case missing-session --test-binary $executables[0] --codex "$env:INFINISHELL_TEST_CODEX_EXE" --supervisor $worker --output "$env:RUNNER_TEMP\codex-missing-session.ndjson"
          if ($LASTEXITCODE -ne 0) { throw 'Native missing-session recovery validation failed' }
          python -B script/cli-agent-parity/run_codex_adapter_live.py --test-case idle-crash --test-binary $executables[0] --codex "$env:INFINISHELL_TEST_CODEX_EXE" --supervisor $worker --output "$env:RUNNER_TEMP\codex-idle-crash.ndjson"
          if ($LASTEXITCODE -ne 0) { throw 'Native idle-crash boundary validation failed' }
          # 实际穿过 Rust 启动器、cmd 包装及同提交监督 worker，不能只检验字符串转义。
          $shimDirectory = Join-Path $env:RUNNER_TEMP ('codex shim 中文 & path-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $shimDirectory | Out-Null
          Copy-Item -LiteralPath $env:INFINISHELL_TEST_CODEX_EXE -Destination (Join-Path $shimDirectory 'codex-native.exe')
          $shim = Join-Path $shimDirectory 'codex.cmd'
          $shimContents = '@echo off' + "`r`n" + '"%~dp0codex-native.exe" %*' + "`r`n" + 'exit /b %errorlevel%' + "`r`n"
          [System.IO.File]::WriteAllText($shim, $shimContents, [System.Text.Encoding]::ASCII)
          python -B script/cli-agent-parity/run_codex_adapter_live.py --test-case missing-session --test-binary $executables[0] --codex $shim --supervisor $worker --output "$env:RUNNER_TEMP\codex-missing-session-cmd.ndjson"
          if ($LASTEXITCODE -ne 0) { throw 'Native cmd shim missing-session recovery validation failed' }

      - name: Preserve Windows native CLI boundary evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-native-boundaries-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-plugin-lifecycle.json
            ${{ runner.temp }}/codex-plugin-cache-refresh.json
            ${{ runner.temp }}/codex-missing-session*
            ${{ runner.temp }}/codex-idle-crash.*
            ${{ runner.temp }}/claude-initialize-idle-eof.json
            ${{ runner.temp }}/claude-permission-observation.json
            ${{ runner.temp }}/claude-21278-inputs/claude-fixed-inputs.json
            ${{ runner.temp }}/grok-cli-fixed/grok-fixed-inputs.json
            ${{ runner.temp }}/grok-fixed-acp.json
          if-no-files-found: error
          retention-days: 14

      - name: Test rust-genai
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        shell: pwsh
        run: cargo test --manifest-path lib/rust-genai/Cargo.toml --lib

      - name: Compile GUI integration tests
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: pwsh
        run: cargo nextest run --no-run -p integration

      - name: Run desktop workspace unit tests
        if: ${{ !cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: pwsh
        # 全量桌面测试不包含 TUI；本次变动的 TUI 消息状态已由上方定向步骤覆盖。
        # integration 需要专用图形会话，此处完成跨平台编译后交由 GUI 测试流程执行。
        # nextest 配置仅串行 Windows 的 warp 主应用测试，其他 crate 仍可并行执行。
        run: cargo nextest run --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude warp_tui

      - name: Report sccache statistics
        if: ${{ always() }}
        shell: pwsh
        run: '& $env:RUSTC_WRAPPER --show-stats'
