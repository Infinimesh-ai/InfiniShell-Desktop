      - name: Run desktop workspace unit tests
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.check_app.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests) }}
        shell: pwsh
        # 全量桌面测试不包含 TUI；本次变动的 TUI 消息状态已由上方定向步骤覆盖。
        # integration 的系统剪贴板用例由上方专用真实窗口步骤执行，其余 GUI 不计为全量通过。
        # nextest 配置仅串行 Windows 的 warp 主应用测试，其他 crate 仍可并行执行。
        run: cargo nextest run --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude warp_tui

      - name: Report sccache statistics
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (always()) }}
        shell: pwsh
        run: '& $env:RUSTC_WRAPPER --show-stats'

      - name: Report Windows source-only gate boundary
        if: ${{ always() && inputs.source_gate_only }}
        shell: pwsh
        env:
          CHECK_RESULT: ${{ steps.check_app.outcome }}
          TEST_RESULT: ${{ steps.test_app.outcome }}
        run: |
          @(
            '### Windows 普通源码门禁'
            "提交：${env:GITHUB_SHA}；cargo check：${env:CHECK_RESULT}；普通主应用回归：${env:TEST_RESULT}。其余源码步骤须按本 job 终态分别审计。"
            '保留原普通广筛、完整更新器、i18n、command/IPC 和平台辅助回归；自建 worker/合成夹具不计外部 CLI 验收。'
            '未执行固定外部 CLI、真实安装/升级/恢复及 GUI 专项；这些条件仍待验收。'
            '6726e735994568e0f2b0995a068d6c5bb32924f1 / run 37045744557 的 Windows 固定 Codex hooks 退出和真实 npm 首 CMD 候选失败仍然保留；本次源码结果不覆盖或修复它们，不关闭 G09，不构成最终合并许可。'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
