            ${{ runner.temp }}/g09-clr-fixture-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  windows_codex_hooks:
    name: Windows fixed Codex 0.156.1 hooks
    needs: validate_scope
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows && inputs.run_atomic_windows_debug && inputs.windows_atomic_debug_scope == 'codex_hooks' }}
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Prepare job-local Python for fixed Codex hook verification
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/prepare_windows_python.ps1

      - name: Test fixed Codex Windows hook contracts
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/codex_windows_hook_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Codex Windows hook contract tests failed' }

      # 复用正式入口和退出判定；本范围不执行旧版、ConPTY、更新事务或 Cargo。
      - name: Verify fixed Codex 0.156.1 Windows native hooks without model requests
        shell: pwsh
        timeout-minutes: 20
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\usr\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -PathType Leaf $_ } | Select-Object -First 1
          if (-not $gitBash) { throw 'Native Git Bash with msys-2.0.dll is required for Codex hooks' }
          $env:INFINISHELL_GIT_BASH_EXE = (Resolve-Path $gitBash).Path
          $env:INFINISHELL_JQ_EXE = (Get-Command jq.exe -ErrorAction Stop).Source
          python -B "$env:GITHUB_WORKSPACE\script\cli-agent-parity\probe_codex_windows_hooks.py" --codex-version 0.156.1 --repo "$env:GITHUB_WORKSPACE" --architecture x86_64 --download-dir "$env:RUNNER_TEMP\codex-01561-hook-inputs" --bash-executable "$env:INFINISHELL_GIT_BASH_EXE" --jq-executable "$env:INFINISHELL_JQ_EXE" --output "$env:RUNNER_TEMP\codex-01561-windows-native-hooks.json"
          if ($LASTEXITCODE -ne 0) { throw 'Codex native Windows hook verification failed; compatibility remains unverified' }

      - name: Preserve fixed Codex 0.156.1 Windows native hook evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-01561-windows-native-hooks-${{ github.sha }}
          path: ${{ runner.temp }}/codex-01561-windows-native-hooks.json
          if-no-files-found: error
          retention-days: 14

  windows_stdio_lifetime:
    name: Windows Rust stdio logon lifetime
    needs: validate_scope
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows && inputs.run_atomic_windows_debug && inputs.windows_atomic_debug_scope == 'g09_stdio_lifetime' }}
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: 'C:\infinishell-ci\cargo-target'
      RUSTC_WRAPPER: 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
      SCCACHE_DIR: 'C:\infinishell-ci\sccache'
      SCCACHE_CACHE_SIZE: 80G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # 该差分只涉及 command 与固定 C helper；最终 app 源码门禁仍走原双平台 job。
      - name: Check Windows command tests
        shell: pwsh
        run: cargo check --locked -p command --tests

      - name: Test Windows command process ownership
        shell: pwsh
        run: cargo nextest run --locked --no-fail-fast --retries 0 -p command --lib -E 'test(managed::tests::) | test(managed_windows_image_observer::tests::) | test(managed_windows_console_probe::tests::) | test(windows::appcontainer::tests::) | test(windows::appcontainer::console_tests::) | test(windows::appcontainer::output::tests::) | test(windows::station_bootstrap::tests::) | test(windows::station_bootstrap::device_map::tests::) | test(windows::station_bootstrap::debugger::tests::) | test(windows::station_bootstrap::debugger::event::tests::)'

      - name: Observe Rust stdio logon lifetime without and with a write
        id: windows_netcredentials
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/verify_windows_netcredentials_station.ps1 -CaseSet Stdio

      - name: Preserve Rust stdio logon lifetime evidence
        if: ${{ always() && (steps.windows_netcredentials.outcome == 'success' || steps.windows_netcredentials.outcome == 'failure') && env.INFINISHELL_WINDOWS_NETCREDENTIALS_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-netcredentials-station-${{ github.sha }}
          path: ${{ env.INFINISHELL_WINDOWS_NETCREDENTIALS_EVIDENCE_DIR }}/**/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    needs: validate_scope
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_windows &&
       inputs.windows_atomic_debug_scope != 'codex_hooks' && inputs.windows_atomic_debug_scope != 'g09_image_contract' && inputs.windows_atomic_debug_scope != 'g09_powershell_contract' && inputs.windows_atomic_debug_scope != 'g09_clr_fixture' && inputs.windows_atomic_debug_scope != 'g09_stdio_lifetime' &&
       (inputs.windows_atomic_debug_scope != 'upstream_essence' || inputs.full_workspace_tests))
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: 'C:\infinishell-ci\cargo-target'
      RUSTC_WRAPPER: 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
      SCCACHE_DIR: 'C:\infinishell-ci\sccache'
      SCCACHE_CACHE_SIZE: 80G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Validate Windows native bridge verification scope
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_grok_native_bridge_source || inputs.run_grok_native_bridge_host) && inputs.windows_grok_installer_only && !inputs.full_workspace_tests }}
        shell: pwsh
        run: throw '普通桥门禁不能与仅安装器模式同时启用'

      # 空间充足时复用 Cargo/sccache；不足时才清理可重建产物，避免每轮从零编译。
      - name: Reclaim Windows build storage
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = Get-PSDrive -Name C
          $drive | Select-Object Name, Used, Free
          if ($drive.Free -ge 100GB) {
            Write-Output 'At least 100 GiB free; retaining Cargo and sccache build artifacts'
            exit 0
          }
          & $env:RUSTC_WRAPPER --stop-server
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'No running sccache server needed to be stopped'
          }

          $buildRoots = @(
            'C:\infinishell-ci\cargo-target',
            'C:\infinishell-ci\sccache'
          )
          foreach ($buildRoot in $buildRoots) {
            $resolved = [System.IO.Path]::GetFullPath($buildRoot)
            if ($resolved -ne $buildRoot) {
              throw "Unexpected build cleanup path: $resolved"
            }
            if (Test-Path -LiteralPath $resolved) {
              Remove-Item -LiteralPath $resolved -Recurse -Force
            }
            New-Item -ItemType Directory -Path $resolved | Out-Null
          }
          Get-PSDrive -Name C | Select-Object Name, Used, Free
          exit 0

      # 直接解压固定摘要的官方 CI 包，保持当前作业以外的 Python 安装配置。
      - name: Prepare job-local Python for CLI parity verification
        id: native_python
        shell: pwsh
        timeout-minutes: 5
        run: ./script/cli-agent-parity/prepare_windows_python.ps1

      # 只打开当前用户的登记根和 profile 目录，不运行 WinGet 或改变注册表。
      - name: Probe Windows package source environment without mutations
        id: package_source_environment
        if: ${{ !cancelled() && steps.native_python.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = python -I -B script/cli-agent-parity/probe_package_source_environment.py
          if ($LASTEXITCODE -ne 0) { throw 'Package source environment probe failed' }
          $path = Join-Path $env:RUNNER_TEMP 'package-source-environment.safe.json'
          [System.IO.File]::WriteAllText($path, ($receipt -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Preserve Windows package source environment
        if: ${{ always() && (steps.package_source_environment.outcome == 'success' || steps.package_source_environment.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-package-source-environment-${{ github.sha }}
          path: ${{ runner.temp }}/package-source-environment.safe.json
          if-no-files-found: error
          retention-days: 14

      - name: Configure Windows build environment
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $strawberryPerl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $strawberryPerl) {
            'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "OPENSSL_SRC_PERL=$strawberryPerl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $libclang = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $libclang 'libclang.dll')) {
            $libclang | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Verify provisioned toolchain
        id: windows_toolchain
        shell: pwsh
        run: |
          $commands = @('git', 'bash', 'rustc', 'cargo', 'cmake', 'protoc', 'perl')
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required command is missing: $command"
            }
          }
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version
          & $env:RUSTC_WRAPPER --version
          & $env:RUSTC_WRAPPER --zero-stats

      # 与仓库共用构建引导使用同一固定 Node 版本；缺依赖必须失败，不能跳过校验。
      - name: Install Node for CLI plugin verification
        id: native_node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0

      - name: Test Grok notification plugin scripts
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node version probe failed' }
          node -e "if (Number(process.versions.node.split('.')[0]) < 18) throw new Error('Node 18+ is required');"
          if ($LASTEXITCODE -ne 0) { throw 'Node test runtime is unavailable' }
          node --test script/cli-agent-parity/grok_plugin_tests.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Grok notification script tests failed' }
          python -B script/cli-agent-parity/grok_plugin_live_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok production installer runner tests failed' }
          python -B script/cli-agent-parity/native_ssh_notifications_tests.py NativeSshNotificationTests.test_grok_bridge_main_uses_the_same_guarded_mapper_on_each_desktop -v
          if ($LASTEXITCODE -ne 0) { throw 'Grok notification bridge contract tests failed' }

      # 安装器补验跳过无关 CLI 的离线合集，仅保留固定 Grok 获取前置。
      - name: Test fixed Grok preparation for installer-only verification
        if: ${{ !inputs.run_windows_npm_native_witness && github.event_name == 'workflow_dispatch' && inputs.windows_grok_installer_only && !inputs.full_workspace_tests }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/prepare_grok_cli_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok preparation runner tests failed' }

      - name: Test Windows Codex npm runner in installer-only verification
        if: ${{ inputs.windows_grok_installer_only && inputs.run_windows_codex_npm_updates && !inputs.full_workspace_tests }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/codex_npm_windows_update_live_runner_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows Codex npm runner contract tests failed' }

      - name: Test notification patch file transactions
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw 'Native Python 3.11+ is required; notification file transactions were not verified'
          }
          python -c "import os, sys; assert os.name == 'nt', 'Native Windows Python is required'; assert sys.version_info >= (3, 11), 'Python 3.11+ is required'; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Native Python version probe failed' }
          # 收齐互相独立的离线失败，避免只修第一个用例就再次等待整轮 CI。
          $PSNativeCommandUseErrorActionPreference = $false
          $failedScripts = @()
          $scripts = @(
            'notification_patch_tests.py',
            'codex_persistent_source_tests.py',
            'codex_adapter_runner_tests.py',
            'claude_adapter_runner_tests.py',
            'claude_profile_runner_tests.py',
            'claude_coordinator_runner_tests.py',
            'claude_coordinator_v2_runner_tests.py',
            'claude_batch_cancel_runner_tests.py',
            'claude_approval_cancel_runner_tests.py',
            'claude_v2_write_cancel_runner_tests.py',
            'claude_image_probe_runner_tests.py',
            'claude_managed_image_runner_tests.py',
            'claude_rich_image_runner_portability_tests.py',
            'codex_source_runner_tests.py',
            'codex_journal_recovery_runner_tests.py',
            'grok_adapter_runner_tests.py',
            'grok_coordinator_runner_tests.py',
            'grok_official_pty_runner_tests.py',
            'grok_policy_preflight_runner_tests.py',
            'grok_native_skill_runner_tests.py',
            'grok_fixed_policy_runner_tests.py',
            'grok_user_skill_runner_tests.py',
            'run_grok_fixed_skill_live_tests.py',
            'grok_image_skill_runner_tests.py',
            'grok_child_coordinator_runner_tests.py',
            'grok_files_policy_runner_tests.py',
            'grok_selected_skill_runner_tests.py',
            'grok_catalog_preflight_runner_tests.py',
            'codex_windows_hook_tests.py',
            'codex_plugin_lifecycle_tests.py',
            'codex_windows_notify_tests.py',
            'codex_plugin_cache_refresh_tests.py',
            'prepare_codex_cli_tests.py',
            'verify_cli_autoupdate_tests.py',
            'run_fixed_cli_autoupdate_tests.py',
            'codex_npm_update_live_runner_tests.py',
            'codex_npm_windows_update_live_runner_tests.py',
            'grok_npm_update_live_runner_tests.py',
            'probe_package_source_environment_tests.py',
            'prepare_claude_cli_tests.py',
            'claude_windows_notifications_tests.py',
            'prepare_grok_cli_tests.py',
            'grok_fixed_acp_probe_tests.py',
            'run_grok_supervised_exit_tests.py',
            'probe_claude_no_credentials_tests.py',
            'probe_claude_permission_snapshot_tests.py'
          )
          foreach ($testScript in $scripts) {
            python -B "script/cli-agent-parity/$testScript" -v
            if ($LASTEXITCODE -ne 0) { $failedScripts += $testScript }
          }
          if ($failedScripts.Count -gt 0) {
            throw ('Windows offline verification failed: ' + ($failedScripts -join ', '))
          }

      - name: Prepare fixed native Codex without credentials
        id: fixed_codex
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.native_python.outcome == 'success' && steps.windows_toolchain.outcome == 'success')) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $codexExecutable = python -B script/cli-agent-parity/prepare_codex_cli.py --version 0.156.1 --download-dir "$env:RUNNER_TEMP\codex-01561-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native Codex preparation failed' }
          "INFINISHELL_TEST_CODEX_EXE=$codexExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 生产通知安装器的当前插件合同仍精确绑定 0.147.0；不要把最新版运行时冒充该合同。
      - name: Prepare fixed Codex production installer contract
        id: fixed_codex_installer
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.native_python.outcome == 'success' && steps.windows_toolchain.outcome == 'success')) }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $codexInstallerExecutable = python -B script/cli-agent-parity/prepare_codex_cli.py --version 0.147.0 --download-dir "$env:RUNNER_TEMP\codex-0147-installer-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Codex production installer contract preparation failed' }
          "INFINISHELL_TEST_CODEX_INSTALLER_EXE=$codexInstallerExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare fixed native Claude without credentials
        id: fixed_claude
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.native_python.outcome == 'success' && steps.windows_toolchain.outcome == 'success')) }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $claudeExecutable = python -B script/cli-agent-parity/prepare_claude_cli.py --claude-version 2.1.280 --download-dir "$env:RUNNER_TEMP\claude-21280-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native Claude preparation failed' }
          "INFINISHELL_TEST_CLAUDE_EXE=$claudeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare fixed native Grok without credentials
        id: fixed_grok
        if: ${{ !inputs.run_windows_npm_native_witness && !inputs.source_gate_only && (!cancelled() && steps.native_python.outcome == 'success' && steps.windows_toolchain.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $grokExecutable = python -B script/cli-agent-parity/prepare_grok_cli.py --version 1.0.41 --download-dir (Join-Path $env:RUNNER_TEMP 'grok-cli-fixed')
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native Grok preparation failed' }
          "INFINISHELL_TEST_GROK_EXE=$grokExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify fixed Grok unauthenticated ACP boundaries
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_grok.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/grok_fixed_acp_probe.py --version 1.0.41 --executable "$env:INFINISHELL_TEST_GROK_EXE" --output (Join-Path $env:RUNNER_TEMP 'grok-fixed-acp.json')
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Grok unauthenticated ACP boundaries failed' }

      - name: Verify native Claude initialization and idle EOF
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_claude.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_claude_no_credentials.py --claude-version 2.1.280 --executable "$env:INFINISHELL_TEST_CLAUDE_EXE" --output "$env:RUNNER_TEMP\claude-initialize-idle-eof.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Claude initialize and idle EOF validation failed' }

      - name: Verify native Claude permission observations without credentials
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_claude.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_claude_permission_snapshot.py --claude-version 2.1.280 --executable "$env:INFINISHELL_TEST_CLAUDE_EXE" --output "$env:RUNNER_TEMP\claude-permission-observation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Claude permission observation validation failed' }

      - name: Verify native Codex plugin registry failure recovery
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_codex.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_codex_plugin_lifecycle.py --codex-version 0.156.1 --codex-executable "$env:INFINISHELL_TEST_CODEX_EXE" --output "$env:RUNNER_TEMP\codex-plugin-lifecycle.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex plugin registry failure recovery failed' }

      - name: Verify native Codex persistent plugin source
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled() && steps.fixed_codex.outcome == 'success') }}
        shell: pwsh
        timeout-minutes: 10
        env:
          PYTHONUTF8: "1"
        run: |
          python -B script/cli-agent-parity/probe_codex_plugin_cache_refresh.py --codex-version 0.156.1 --codex-executable "$env:INFINISHELL_TEST_CODEX_EXE" --output "$env:RUNNER_TEMP\codex-plugin-cache-refresh.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex persistent plugin source validation failed' }

      # 单独验证 Git Bash/jq，不将原生文件事务通过冒充 Windows hooks 已通过。
      # 即使前面的独立门禁失败，也保留这项验证的真实结果。
      - name: Test Windows Git Bash notification payloads
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled()) }}
        shell: pwsh
        timeout-minutes: 3
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -PathType Leaf $_ } | Select-Object -First 1
          if (-not $gitBash) {
            throw 'Windows payloads were not verified: Git for Windows bash.exe is missing'
          }
          $env:PATH = "$(Split-Path -Parent $gitBash);$env:PATH"
          $resolvedBash = (Get-Command bash.exe -ErrorAction Stop).Source
          if ($resolvedBash -ne $gitBash) { throw 'The Bash resolved by payload tests does not match Git for Windows' }
          Write-Output "Verified Git Bash path: $gitBash"
          & $gitBash --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash version probe failed' }
          & $gitBash --noprofile --norc -c 'case "$(uname -s)" in MINGW*|MSYS*) ;; *) exit 1 ;; esac; command -v jq >/dev/null && jq --version'
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows payloads were not verified: native Git Bash or jq is unavailable'
          }
          python -c "import os, sys; assert os.name == 'nt' and sys.version_info >= (3, 11), 'Native Windows Python 3.11+ is required'"
          if ($LASTEXITCODE -ne 0) { throw 'Windows payload Python preflight failed' }
          python script/cli-agent-parity/plugin_compatibility_tests.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows Git Bash notification payload tests failed; hooks remain unverified' }

      # 原生候选只在临时目录加载，必须在模型调用前由真实 hook 阻断，不开启产品安装门禁。
      - name: Verify Codex Windows native hooks without model requests
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled())) }}
        shell: pwsh
        timeout-minutes: 20
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBashCandidates = @(
            "$env:PROGRAMFILES\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\usr\bin\bash.exe"
          )
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -PathType Leaf $_ } | Select-Object -First 1
          if (-not $gitBash) { throw 'Native Git Bash with msys-2.0.dll is required for Codex hooks' }
          $env:INFINISHELL_GIT_BASH_EXE = (Resolve-Path $gitBash).Path
          $env:INFINISHELL_JQ_EXE = (Get-Command jq.exe -ErrorAction Stop).Source
          python -B "$env:GITHUB_WORKSPACE\script\cli-agent-parity\probe_codex_windows_hooks.py" --repo "$env:GITHUB_WORKSPACE" --architecture x86_64 --download-dir "$env:RUNNER_TEMP\codex-0147-hook-inputs" --bash-executable "$env:INFINISHELL_GIT_BASH_EXE" --jq-executable "$env:INFINISHELL_JQ_EXE" --output "$env:RUNNER_TEMP\codex-windows-native-hooks.json"
          if ($LASTEXITCODE -ne 0) { throw 'Codex native Windows hook verification failed; compatibility remains unverified' }

      - name: Preserve Codex Windows native hook evidence
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled())) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-windows-native-hooks-${{ github.sha }}
          path: ${{ runner.temp }}/codex-windows-native-hooks.json
          if-no-files-found: error
          retention-days: 14

      # 单独读取真实 ConPTY 字节；hook 完成或独立 CONOUT$ 标记均不能代替通知到达。
      - name: Verify Codex Windows ConPTY notification transport
        if: ${{ !inputs.source_gate_only && ((github.event_name != 'workflow_dispatch' || !inputs.windows_grok_installer_only || inputs.full_workspace_tests) && (!cancelled())) }}
        shell: pwsh
