name: Cross-platform preflight

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:
    inputs:
      run_linux:
        description: Run the Linux self-hosted job
        required: true
        default: true
        type: boolean
      run_windows:
        description: Run the Windows self-hosted job
        required: true
        default: true
        type: boolean
      run_macos_intel:
        description: 在标准 macOS runner 上验证 Intel CLI
        required: true
        default: false
        type: boolean
      run_intel_dmg_validation:
        description: 原生 Intel 主机只读验收指定发行 Run 的 DMG
        required: true
        default: false
        type: boolean
      release_run_id:
        description: 生成 Intel DMG 的正式 GitHub Actions Run ID
        required: false
        type: string
      release_tag:
        description: 该 Run 对应的冻结发布 Tag
        required: false
        type: string
      release_sha:
        description: 该 Tag 应指向的精确源提交 SHA
        required: false
        type: string
      full_workspace_tests:
        description: Compile GUI integration tests and run the desktop workspace unit suite
        required: true
        default: false
        type: boolean
# 自托管 runner 只需要读取代码。这个 workflow 不接收部署密钥，也不向仓库写入内容。
permissions:
  contents: read
  actions: read

concurrency:
  group: cross-platform-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux x64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_linux)
    runs-on: [self-hosted, linux, x64, infinishell-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify provisioned toolchain
        shell: bash
        run: |
          set -euo pipefail
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version

      - name: Check InfiniShell-Desktop
        shell: bash
        run: cargo check -p warp --lib

      - name: Test agent lifecycle, terminal cancellation, and Responses integration
        shell: bash
        run: >-
          cargo nextest run --no-fail-fast -p warp --lib
          -E 'test(responses) | test(ai::agent_providers::) | test(ai::api_error::tests) | test(ai::byop_compaction::) | test(ai::blocklist::controller) | test(ai::agent::tests::format_for_copy) | test(terminal::view::tests::stop_task_) | test(terminal::view::tests::failed_conversation_interrupts_command_without_overwriting_error) | test(ai::blocklist::action_model::tests::) | test(ai::blocklist::action_model::preprocess::tests::) | test(ai::blocklist::action_model::execute::request_file_edits::tests::) | test(terminal::view::tests::stopped_command_) | test(completed_user_controlled_lrc_) | test(inline_agent_view_persists_across_transfer_takeover_for_monitored_long_running_command) | test(terminal::local_tty::event_loop::tests::) | test(terminal::local_tty::windows::event_loop_tests::) | test(synchronized_output) | test(ai::agent::conversation::) | test(ai::agent::task::) | test(ai::skills::) | test(ai::blocklist::action_model::execute::read_skill::) | test(ai::blocklist::history_model) | test(persistence::sqlite::checkpoint_tests) | test(i18n::tests)'

      - name: Test rust-genai
        shell: bash
        run: cargo test --manifest-path lib/rust-genai/Cargo.toml --lib

      - name: Compile GUI integration tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: bash
        run: cargo nextest run --no-run -p integration

      - name: Run desktop workspace unit tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: bash
        # warp_tui 仍依赖已移除的 Warp 云 API，也不属于桌面版发布产物。
        # integration 需要专用图形会话，此处完成跨平台编译后交由 GUI 测试流程执行。
        run: cargo nextest run --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude warp_tui

  macos_intel_cli:
    name: macOS Intel CLI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_intel }}
    runs-on: macos-26-intel
    timeout-minutes: 360
    env:
      CHANNEL: oss
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_CLI_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: preflight-macos-x86_64-cli
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure Intel rust target is installed
        shell: bash
        run: rustup target add x86_64-apple-darwin

      - name: Build Intel CLI
        id: bundle_cli
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sysctl -n hw.memsize
          # 诊断包使用当次运行的临时版本，不创建或移动正式发布 Tag。
          export GIT_RELEASE_TAG="v0.$(date -u +%Y.%m.%d.%H.%M).oss_01"
          echo "GIT_RELEASE_TAG=$GIT_RELEASE_TAG" >> "$GITHUB_ENV"
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --nosign

      - name: Verify Intel CLI tarball
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ steps.bundle_cli.outputs.binary_path }}"
          resources="${{ steps.bundle_cli.outputs.bundled_resources_dir }}"
          file "$binary"
          version=$("$binary" --version)
          echo "$version"
          [[ "$version" == *"$GIT_RELEASE_TAG"* ]]
          cp "$binary" infinishell
          tar czf infinishell-intel-cli-preflight.tar.gz infinishell \
            -C "$(dirname "$resources")" resources
          shasum -a 256 infinishell-intel-cli-preflight.tar.gz
          df -h .

      - name: Upload Intel CLI preflight tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infinishell-intel-cli-preflight
          path: infinishell-intel-cli-preflight.tar.gz
          if-no-files-found: error
          retention-days: 3

  macos_intel_dmg_validation:
    name: macOS Intel DMG native acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_intel_dmg_validation }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Download and verify exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'Infinimesh-ai/InfiniShell-Desktop' ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.oss_[0-9]{2}$ ]]
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq .head_sha)
          [[ "$run_sha" == "$RELEASE_SHA" ]]
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          [[ "$tag_sha" == "$RELEASE_SHA" ]]
          mkdir -p assets/intel assets/resources
          gh run download "$RELEASE_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n infinishell-macos-intel -D assets/intel
          gh run download "$RELEASE_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n infinishell-bundled-remote-server-resources -D assets/resources
          shasum -a 256 assets/resources/remote-server/manifest.json

      - name: Mount DMG read-only and run native Intel binary
        shell: bash
        run: |
          set -euo pipefail
          dmg_count=$(find assets/intel -type f -name '*.dmg' | wc -l | tr -d ' ')
          [[ "$dmg_count" -eq 1 ]]
          dmg_file=$(find assets/intel -type f -name '*.dmg' -print -quit)
          manifest_sha=$(shasum -a 256 assets/resources/remote-server/manifest.json | awk '{print $1}')
          python3 script/release/validate-intel-dmg.py \
            --tag "$RELEASE_TAG" \
            --dmg "$dmg_file" \
            --ci-resources assets/resources/remote-server \
            --isolation "$RUNNER_TEMP/intel-dmg-acceptance-$GITHUB_RUN_ID" \
            --manifest-sha256 "$manifest_sha" \
            --expected-signature adhoc
          shasum -a 256 "$dmg_file"

      - name: Upload native acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infinishell-intel-dmg-native-acceptance
          path: ${{ runner.temp }}/intel-dmg-acceptance-${{ github.run_id }}/result.json
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_windows)
    runs-on: [self-hosted, windows, x64, infinishell-ci]
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: 'C:\infinishell-ci\cargo-target'
      RUSTC_WRAPPER: 'C:\infinishell-ci\tools\sccache-v0.17.0\sccache.exe'
      SCCACHE_DIR: 'C:\infinishell-ci\sccache'
      SCCACHE_CACHE_SIZE: 80G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Configure Windows build environment
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $strawberryPerl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $strawberryPerl) {
            'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "OPENSSL_SRC_PERL=$strawberryPerl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $libclang = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $libclang 'libclang.dll')) {
            $libclang | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Verify provisioned toolchain
        shell: pwsh
        run: |
          $commands = @('git', 'bash', 'rustc', 'cargo', 'cmake', 'protoc', 'perl')
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required command is missing: $command"
            }
          }
          git --version
          rustc --version
          cargo --version
          cargo nextest --version
          cmake --version
          protoc --version
          & $env:RUSTC_WRAPPER --version
          & $env:RUSTC_WRAPPER --zero-stats

      - name: Check InfiniShell-Desktop
        shell: pwsh
        run: cargo check -p warp --lib

      - name: Build InfiniShell SSH worker
        shell: pwsh
        run: cargo build -p warp --bin infinishell-ssh --features "release_bundle,gui,autoupdate,nld_classifier_v3,nld_heuristic_v2,rust_ssh_worker"

      - name: Test Windows PowerShell SSH worker arguments
        shell: powershell
        run: >-
          .\script\windows\test_pwsh_ssh_worker.ps1
          -WorkerPath "$env:CARGO_TARGET_DIR\debug\infinishell-ssh.exe"

      - name: Test agent lifecycle, terminal cancellation, and Responses integration
        shell: pwsh
        run: >-
          cargo nextest run --no-fail-fast -p warp --lib
          -E 'test(responses) | test(ai::agent_providers::) | test(ai::api_error::tests) | test(ai::byop_compaction::) | test(ai::blocklist::controller) | test(ai::agent::tests::format_for_copy) | test(terminal::view::tests::stop_task_) | test(terminal::view::tests::failed_conversation_interrupts_command_without_overwriting_error) | test(ai::blocklist::action_model::tests::) | test(ai::blocklist::action_model::preprocess::tests::) | test(ai::blocklist::action_model::execute::request_file_edits::tests::) | test(terminal::view::tests::stopped_command_) | test(completed_user_controlled_lrc_) | test(inline_agent_view_persists_across_transfer_takeover_for_monitored_long_running_command) | test(terminal::local_tty::event_loop::tests::) | test(terminal::local_tty::windows::event_loop_tests::) | test(synchronized_output) | test(ai::agent::conversation::) | test(ai::agent::task::) | test(ai::skills::) | test(ai::blocklist::action_model::execute::read_skill::) | test(ai::blocklist::history_model) | test(persistence::sqlite::checkpoint_tests) | test(i18n::tests)'

      - name: Test rust-genai
        shell: pwsh
        run: cargo test --manifest-path lib/rust-genai/Cargo.toml --lib

      - name: Compile GUI integration tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: pwsh
        run: cargo nextest run --no-run -p integration

      - name: Run desktop workspace unit tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_workspace_tests }}
        shell: pwsh
        # warp_tui 仍依赖已移除的 Warp 云 API，也不属于桌面版发布产物。
        # integration 需要专用图形会话，此处完成跨平台编译后交由 GUI 测试流程执行。
        # nextest 配置仅串行 Windows 的 warp 主应用测试，其他 crate 仍可并行执行。
        run: cargo nextest run --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude warp_tui

      - name: Report sccache statistics
        if: ${{ always() }}
        shell: pwsh
        run: '& $env:RUSTC_WRAPPER --show-stats'
