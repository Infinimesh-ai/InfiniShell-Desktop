[package]
name = "warp_logging"
edition = "2024"
description = "Warp logging configuration"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cfg-if.workspace = true
env_logger.workspace = true
log.workspace = true
warp_core.workspace = true
warp_errors.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs.workspace = true
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
# 关闭默认 bzip2，避免引入仓库许可证规则不接受的 bzip2-1.0.6。
zip = { version = "9.0.5", default-features = false, features = [
    "aes-crypto",
    "deflate",
    "deflate64",
    "lzma",
    "time",
    "xz",
    "zstd",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.6" }
js-sys = "0.3.63"
wasm-bindgen.workspace = true
web-sys.workspace = true
warp_web_event_bus.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true

[features]
crash_reporting = ["warp_core/crash_reporting"]
agent_mode_evals = []
